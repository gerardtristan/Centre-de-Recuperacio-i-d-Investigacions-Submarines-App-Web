name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Base de dades efímera del pipeline, sense cap dada.
          POSTGRES_USER: cris
          POSTGRES_PASSWORD: cris-ci
          POSTGRES_DB: cris
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cris:cris-ci@localhost:5432/cris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migracions al dia
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Proves i cobertura
        # Cobertura de línies i branques d'`apps/` (decisió 089, D5). Llindar: el valor mesurat el
        # 13/11/2026 (97,66 %), arrodonit avall. Només pot pujar.
        run: pytest --cov --cov-report=term --cov-fail-under=97.6
      - name: Comprovació de desplegament
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export FIELD_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export CARD_QR_KEYS="ci:$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          CARD_QR_ACTIVE_KEY: ci
          DJANGO_ALLOWED_HOSTS: cris1954.cat
          # Valors de mostra: només comproven que producció arrenca; no envien res.
          EMAIL_HOST: smtp.example.invalid
          EMAIL_HOST_USER: proves
          EMAIL_HOST_PASSWORD: contrasenya-de-proves-1954
          S3_BUCKET_FITXERS: cris-ci
          S3_ENDPOINT_URL: https://s3.example.invalid
          S3_ACCESS_KEY_ID: proves
          S3_SECRET_ACCESS_KEY: contrasenya-de-proves-1954
          # EMAIL_ALERT_TO no es defineix: es comprova la de producció (decisió 084). Si quedés
          # buida, core.W001 faria fallar aquest pas. Aquest pas no envia cap correu.

  e2e:
    # Suite de prova ràpida al navegador (T-M00-07): Postgres 16 i Chromium de Playwright.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Base de dades efímera del pipeline, sense cap dada.
          POSTGRES_USER: cris
          POSTGRES_PASSWORD: cris-ci
          POSTGRES_DB: cris
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cris:cris-ci@localhost:5432/cris
      # Chromium dins del paquet de Playwright, com en local (apps/core/tests/e2e/conftest.py).
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Chromium de Playwright
        run: python -m playwright install --with-deps chromium-headless-shell
      - name: Proves e2e
        run: pytest -m e2e apps/core/tests/e2e
      - name: Captures de les proves e2e (només si fallen)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: .e2e-captures/
          retention-days: 7

  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Captures del diari de 500 KB com a màxim
        run: |
          grans=$(find docs/diari-de-construccio/captures -type f -size +500000c)
          if [ -n "$grans" ]; then echo "Captures de més de 500 KB:"; echo "$grans"; exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    # Push: l'acció de gitleaks revisa els commits nous. PR: l'acció només rep 30 commits de
    # l'API, així que un pas propi revisa tot el rang de la base al cap (decisió 078).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gitleaks sobre tota la PR, de la base al cap (decisió 078)
        if: github.event_name == 'pull_request'
        env:
          # La mateixa versió que fa servir l'acció; suma del checksums.txt oficial de la versió.
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "Rang ${BASE_SHA}..${HEAD_SHA}: $(git rev-list --count --no-merges "${BASE_SHA}..${HEAD_SHA}") commits sense fusions"
          "$RUNNER_TEMP/gitleaks" detect --source . --redact -v --exit-code=2 --log-level=info --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
