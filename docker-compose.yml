# PostgreSQL per al desenvolupament local. No és la configuració de producció (Coolify).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cris
      POSTGRES_DB: cris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defineix POSTGRES_PASSWORD al fitxer .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dades-postgres:/var/lib/postgresql/data

volumes:
  dades-postgres:
