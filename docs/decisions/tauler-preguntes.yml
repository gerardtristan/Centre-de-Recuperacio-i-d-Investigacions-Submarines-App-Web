# Tauler de preguntes pendents: opcions i recomanació de Claude
#
# El tauler és un apartat de la línia cronològica, protegit amb una segona contrasenya
# (tools/linia-cronologica/README.md). Mostra totes les preguntes obertes que el generador ja llegeix:
# docs/decisions/pendents.md (oberts i preguntes de les tandes), l'apèndix de preguntes de
# docs/planning.md (#preguntes) i docs/preguntes-externes.md.
#
# Aquest fitxer NO repeteix el text de les preguntes: només hi afegeix les opcions A a D i quina
# recomana Claude, escrita en el moment de fer la pregunta (mai per la IA de Make). Una pregunta
# sense entrada aquí surt al tauler només amb la resposta lliure.
#
# Clau: l'identificador tal com surt a la font (P-49, «S-M01-04», «S-M01-12, 13»...). Les preguntes
# de les tandes de pendents.md llegeixen les opcions de la columna «Opcions» i no cal posar-les aquí.
#
# Camps de cada entrada:
#   punt        (opcional) quina part concreta de la pregunta responen les opcions
#   opcions     de 2 a 4, amb les claus A, B, C i D
#   recomanada  la clau que recomana Claude
#   perque      per què, en una o dues frases
#   data        quan es va escriure la recomanació (AAAA-MM-DD)
#
# Preguntes noves que Claude fa en un fil i que no són a cap altra font: van a «noves», amb
# un identificador F-NNN que no es reutilitza, i també porten:
#   pregunta, context, responsable, tasques (llista), bloqueja (true si atura una tasca)
# Quan la resposta s'incorpora al pla o a una decisió, l'entrada de «noves» s'esborra.

opcions:
  P-07:
    opcions:
      A: No es desa res del certificat mèdic; el centre de busseig o l'instructor el comprova fora de la plataforma.
      B: Només la data fins a la qual és vàlid, sense cap document ni cap altra dada.
      C: El soci declara en inscriure's que té el certificat vigent (sí o no), sense desar cap data.
      D: Decidir-ho amb l'assessor de protecció de dades abans de triar.
    recomanada: A
    perque: >-
      La regla «cap dada de salut a la plataforma» és del CLAUDE.md, i fins i tot una data de validesa
      revela que la persona té (o no) un certificat mèdic. A és l'única opció que no obre cap
      excepció; si més endavant cal, es pot passar a C sense migrar dades.
    data: 2026-11-12

  P-11:
    opcions:
      A: El CLAUDE.md fa de constitució i no es crea cap fitxer nou.
      B: Crear docs/constitution.md amb els principis i deixar al CLAUDE.md només les instruccions per a Claude.
    recomanada: A
    perque: >-
      El CLAUDE.md ja té les regles que s'han de complir sempre; un segon fitxer duplicaria el contingut,
      cosa que el mateix CLAUDE.md prohibeix.
    data: 2026-11-12

  P-13:
    opcions:
      A: Anonimitzar les entrevistes (rols en lloc de noms, sense dades de contacte) i pujar-les a docs/context/.
      B: No pujar-les mai; només un resum anonimitzat de les conclusions.
      C: Deixar-les fora del repositori tal com estan ara.
    recomanada: B
    perque: >-
      Un resum de conclusions dona el mateix valor per al projecte i elimina el risc que una frase concreta
      permeti identificar algú. Anonimitzar un text sencer és més feina i més fàcil de fer malament.
    data: 2026-11-12

  P-14:
    opcions:
      A: Fer una versió nova del document incremental amb el context v4 i moure l'actual a docs/arxiu/.
      B: Mantenir l'actual com a vigent i afegir-hi un annex amb els canvis del context v4.
      C: No tocar-lo fins a la propera entrega de l'assignatura.
    recomanada: C
    perque: >-
      És un lliurament de l'assignatura: el moment natural de fer-ne la versió nova és la propera entrega,
      i llavors es fa com diu A (versió nova i l'antiga a l'arxiu, que mai s'esborra).
    data: 2026-11-12

  P-22:
    opcions:
      A: Claude genera un .docx nou amb els textos de substitució aplicats i el PDF corresponent.
      B: Aplicar els textos a mà al .docx actual.
      C: Deixar el .docx com a document històric i remetre al pla (docs/planning.md) per a la versió vigent.
    recomanada: C
    perque: >-
      El pla és la font única de l'especificació (decisió 047); mantenir el .docx al dia duplica feina cada
      vegada que canvia una regla. Una nota a la portada que remeti al pla evita confusions.
    data: 2026-11-12

  P-38:
    opcions:
      A: Fase futura, després del mòdul 02 (que registra l'assistència); llavors es decideixen fites i punts.
      B: Només la bitàcola (sortides i hores), sense insígnies ni punts.
      C: Bitàcola i insígnies, sense punts.
      D: Treure-ho del wireframe del compte personal fins que la junta ho demani.
    recomanada: A
    perque: >-
      Les dades de la bitàcola surten de l'assistència del mòdul 02, que encara no existeix. Decidir ara
      fites i punts seria decidir sobre dades que no tenim.
    data: 2026-11-12

  P-39:
    opcions:
      A: Corregir el nom a la propera versió del document incremental (lligat a la P-14).
      B: Fer ara una versió corregida només amb el nom.
    recomanada: A
    perque: Els fitxers de text del repositori ja estan corregits; el PDF es pot esperar a la propera versió.
    data: 2026-11-12

  P-41:
    opcions:
      A: Cap foto sense autor i permís registrats, consentiment de les persones que hi surtin i text de crèdit fix.
      B: Al principi, només fotos sense persones reconeixibles (fons marí, material, instal·lacions).
      C: Fotos amb persones només de socis que ho hagin acceptat al seu perfil.
      D: Cap foto fins que la web pública (mòdul 07) estigui a punt de sortir.
    recomanada: B
    perque: >-
      B permet tenir galeria des del primer dia sense haver de gestionar consentiments; A és la regla per a
      quan s'hi vulguin afegir fotos amb persones.
    data: 2026-11-12

  P-48:
    opcions:
      A: No; un sol tresorer i cap acció amb doble aprovació.
      B: Només com a opció futura, si la junta la demana per a devolucions a partir d'un import.
    recomanada: A
    perque: >-
      El club té un sol tresorer i la regla del projecte és no fer de la doble aprovació un requisit.
      Si la junta ho vol més endavant, es reobre amb una decisió nova.
    data: 2026-11-12

  P-49:
    punt: "(1) quines llengües vol el club i on"
    opcions:
      A: Només català a tota la plataforma, de moment (la plataforma ja queda preparada per traduir-se, 061).
      B: Català i castellà només a la web pública.
      C: Català i castellà a la web pública i als correus; l'àrea de socis i l'administració, només en català.
      D: Català, castellà i anglès a la web pública; la resta, només en català.
    recomanada: A
    perque: >-
      Cada llengua activa demana una persona que tradueixi i revisi cada canvi, també dels textos legals.
      Sense aquesta persona, la 061 ja diu que la llengua no s'activa; és millor decidir-ho quan hi sigui.
    data: 2026-11-12

  P-53:
    punt: "si la cua de la T-M01-39 és condició del nivell 1 de producció (Q-086)"
    opcions:
      A: No és condició del nivell 1; es fa quan toqui, com qualsevol altra tasca.
      B: Només és condició si la mesura darrere del proxy encara mostra una diferència apreciable (més de 5 ms de mediana).
      C: Sí, és condició del nivell 1 sigui quin sigui el resultat de la mesura.
    recomanada: B
    perque: >-
      La diferència es va mesurar en local; darrere del proxy i de la xarxa pot quedar amagada pel soroll.
      Decidir amb la mesura real evita fer una cua que potser no cal.
    data: 2026-11-12

  P-61:
    punt: "(2) si el «suspens» d'un termini impagat és la marca manual d'impagat (040) o un bloqueig automàtic"
    opcions:
      A: La marca manual d'impagat (040); la plataforma proposa el candidat i el tresorer el confirma amb motiu, com amb la quota (085, J-4).
      B: Bloqueig automàtic l'endemà del venciment del termini.
      C: Bloqueig automàtic amb un avís previ al soci uns dies abans.
      D: Ajornar-ho fins que comenci la T-M01-49.
    recomanada: A
    perque: >-
      Fa servir el mateix mecanisme que ja està aprovat per a la quota anual (040 i 085), així el soci i el
      tresorer veuen una sola regla i no cal cap estat nou.
    data: 2026-11-12

  P-80:
    opcions:
      A: Dos usuaris de base de dades en desplegar, un per a les migracions i un per a l'aplicació; el de l'aplicació, sense UPDATE, DELETE ni TRUNCATE a les taules on només s'afegeixen files.
      B: Un sol usuari i només l'activador, com ara, i deixar-ho escrit com a risc acceptat.
      C: Dos usuaris també en local i al CI, perquè una prova ho comprovi a cada canvi.
    recomanada: A
    perque: >-
      L'activador ja atura qualsevol canvi, també amb una consulta directa; el segon usuari és una
      barrera més per si algú treu l'activador. Només té sentit on hi ha dades reals, i per això es fa
      en desplegar i no en local (C duplicaria la configuració de totes les proves).
  P-82:
    opcions:
      A: Deixar la llista com és; el que no hi encaixa ho resol el tresorer a mà, fora de l'intent.
      B: Afegir només la confirmació tardana (fallit, caducat o abandonat passen a pagat, o a revisar si el càrrec ja era pagat).
      C: La B i, a més, sortir d'«a revisar» (a pagat o a fallit, amb motiu del tresorer) i «creat → cancel·lat».
      D: Esperar la resposta del proveïdor (P-45) abans de tocar la llista.
    recomanada: C
    perque: >-
      Sense la B no es pot complir RN-M05b-08: un pagament vàlid que arriba tard no es podria apuntar.
      Sense sortida d'«a revisar», el tresorer no pot tancar cap cas. Mentrestant val la A.
    data: 2026-11-13

  P-83:
    opcions:
      A: Esperar; el càrrec no es pot tornar a provar fins que l'intent acabi sol (notificació del proveïdor o xarxa de seguretat).
      B: Reprendre; mentre l'intent és en curs, «Paga ara» torna el soci a la mateixa ordre del proveïdor, sense intent ni ordre nous.
      C: Fer caducar l'intent amb targeta al cap d'un temps configurable (per exemple, 30 minuts) i deixar-ne començar un de nou.
      D: Esperar la resposta del proveïdor (P-45) sobre si una ordre es pot cancel·lar i quan caduca.
    recomanada: B
    perque: >-
      Amb la A, qui tanca la pàgina sense voler es queda sense poder pagar fins l'endemà. La B no pot
      cobrar dues vegades, perquè és la mateixa ordre, i no depèn de cap resposta del proveïdor. La C
      necessita abans la P-78 (confirmacions tardanes). Mentrestant val la A.
    data: 2026-11-13

  P-84:
    opcions:
      A: Com s'ha construït; el 05b crea el pagament de la 00 en una sola funció i no s'envia cap correu fins més endavant.
      B: Una PR petita de la 00 (després de la T-M04-02) amb el servei que crea el pagament i les dues plantilles de correu; el 05b el crida.
      C: Que l'intent de pagament del 05b substitueixi el pagament de la 00 (un sol model).
    recomanada: B
    perque: >-
      Compleix la regla dels serveis i la conciliació de la 04 (T-M04-12) en necessitarà el mateix servei.
      La C és un canvi de model de dades gran sobre peces ja fetes. Mentrestant val la A.
    data: 2026-11-13

  P-81:
    opcions:
      A: Com s'ha construït; les quotes van a «General / Quotes de socis» i les inscripcions i llicències, sense centre de cost fins que el càrrec en porti (segona meitat de la T-M04-02), que es fa abans de cobrar-ne cap de debò.
      B: Rebutjar l'ingrés d'una inscripció o d'una llicència fins que el càrrec porti centre de cost.
      C: Que qui crida el servei (pagaments, activitats o llicències) li digui el centre de cost.
    recomanada: A
    perque: >-
      A la fase 1 només es cobren quotes, i el pla ja diu on van. Un ingrés sense centre de cost és un
      estat que el model admet; B deixaria un cobrament confirmat sense apuntar, i C faria que cada
      mòdul sabés coses de la tresoreria que després caldria desfer.
    data: 2026-11-13

  P-88:
    opcions:
      A: Com s'ha construït; el trànsit que crea la instal·lació (migrate) no deixa entrada al registre, com els comptes inicials, i el que es creï des d'una pantalla, sí.
      B: Que sempre en deixi, amb el sistema com a actor, i adaptar les proves del 00 i del 01 que compten les entrades del registre.
      C: Una entrada al registre per a tots els comptes creats per la instal·lació (també «Caixa» i «Banc principal»), en una tasca del 00.
    recomanada: A
    perque: >-
      El compte ja diu quan es va crear i qui el crea és sempre la instal·lació, igual que els comptes
      inicials. La B toca proves del 00 sense guanyar cap dada; la C té sentit si la junta vol el registre
      de tota la configuració. Mentrestant val la A.
    data: 2026-11-13

  P-100:
    opcions:
      A: Com s'ha construït; només val el prefix actual i el prefix no es canvia un cop hi hagi referències emeses.
      B: Es valida el codi i el control amb qualsevol prefix ben format, i la conciliació busca la referència a la base de dades.
      C: Es guarda la llista de prefixos que s'han fet servir i es validen tots.
    recomanada: B
    perque: >-
      La referència que té el soci no caduca mai (M04-6), i la conciliació l'ha de buscar igualment a la base de dades.
      La B no depèn de cap valor de l'entorn. Es decideix amb la T-M04-11, que és qui la fa servir; mentrestant val la A.
    data: 2026-11-16

  P-101:
    opcions:
      A: Com s'ha construït; com CA-T09.3, «a revisar» només si hi ha un sol càrrec pendent del mateix import; la resta, «pendents».
      B: Com LT2, tota línia d'entrada sense referència va «a revisar».
      C: «A revisar» si hi ha almenys un càrrec pendent del mateix import, encara que n'hi hagi més d'un.
    recomanada: A
    perque: >-
      La llista «a revisar» ha de servir per al que demana una decisió; amb la B s'hi barrejarien liquidacions i
      abonaments que no són quotes. Totes les línies pendents ja surten a la conciliació, i el canvi es pot fer en
      qualsevol moment perquè l'estat es torna a calcular.
    data: 2026-11-16

  P-102:
    opcions:
      A: Com s'ha construït; de 24 a 168 hores (d'un dia a una setmana).
      B: De 24 a 72 hores (com a màxim tres reintents de la xarxa).
      C: D'1 a 168 hores, perquè la xarxa també pugui deixar a revisar el mateix dia.
      D: Decidir-ho amb el tresorer quan es vegi l'ús real; mentrestant, la A.
    recomanada: A
    perque: >-
      La xarxa de seguretat passa un cop al dia: per sota de 24 hores, un sol reintent fallat ja enviaria l'intent a revisar
      i una caiguda curta del proveïdor l'hi portaria. Una setmana és prou perquè el tresorer el vegi abans que el soci
      reclami, i el rang es pot canviar sense tocar cap intent.
    data: 2026-11-16

  P-103:
    opcions:
      A: Com s'ha construït; data d'operació, concepte amb els registres 23 i les referències, un sol compte en euros, fitxer sencer o res.
      B: Com la A, però amb la data de valor.
      C: Com la A, però acceptant diversos comptes en un fitxer (caldria triar el compte a la pantalla).
      D: Esperar la mostra del banc (P-45 punt 10); mentrestant, la A.
    recomanada: A
    perque: >-
      La data d'operació és la que veu el tresorer a la banca en línia i la que porten els pagaments del proveïdor, i per
      tant la que ajuda més a conciliar. Un sol compte per fitxer evita barrejar comptes a la conciliació (si el club en
      fa servir més d'un, la C), i un fitxer amb uns totals que no quadren és un fitxer malmès: millor tornar-lo a
      descarregar que importar-ne una part amb saldos equivocats.
    data: 2026-11-16

  P-110:
    opcions:
      A: La plataforma no toca el soci; la correcció avisa per correu qui pot editar les quotes, que decideix a mà.
      B: El soci torna a l'estat que tenia abans de la quota (pendent) i el carnet es revoca.
      C: El soci continua actiu fins al «vàlid fins al» anterior a la quota corregida i el carnet nou es revoca.
      D: La 045 no s'admet sobre una quota que ja ha activat un soci; es corregeix amb una devolució.
    recomanada: A
    perque: >-
      L'error és del tresorer, no del soci: canviar-li l'estat o revocar-li el carnet sense que ningú ho miri pot deixar
      fora d'una sortida algú que sí ha pagat (la transferència correcta sovint arriba el mateix dia). Amb l'avís, la
      secretaria ho resol en minuts, i la B o la C es poden afegir després sense tocar cap dada ja desada.
    data: 2026-11-16

  P-111:
    opcions:
      A: La data de valor de la línia de l'extracte (cal que el nucli deixi passar una data a record_payment).
      B: Com s'ha construït; la data en què el tresorer confirma la conciliació.
      C: La data d'operació de la línia, que és la que desa avui la importació (P-103), encara que no sigui la de valor.
    recomanada: A
    perque: >-
      El saldo del banc a la plataforma ha de coincidir amb el de l'extracte el mateix dia, i això només passa si l'ingrés
      porta la data del banc. Com que la importació desa una sola data per línia (P-103), la A i la C coincideixen fins
      que es resolgui aquella pregunta.
    data: 2026-11-16

  P-120:
    opcions:
      A: Com s'ha construït; Fernet de `cryptography` (ja és dependència), una clau per versió, xifra la més alta.
      B: AES-256-GCM de `cryptography` amb l'identificador de la fila com a dades associades, perquè un xifrat no es pugui moure a una altra fila.
      C: Xifrar a PostgreSQL amb pgcrypto.
      D: Un gestor de claus extern de la UE (per exemple, el de Scaleway) que guardi la clau mestra.
    recomanada: A
    perque: >-
      Fernet és xifratge autenticat, ja s'usa per als secrets TOTP i no afegeix cap dependència. La C fa passar la clau
      per les consultes i els registres de la base de dades, contra la 044; la D afegeix un proveïdor i un punt de
      fallada per a un club petit. La B només protegeix contra qui ja pot escriure a la base de dades, i s'hi pot passar
      més endavant amb una rotació.
    data: 2026-11-16

  P-130:
    opcions:
      A: «casella» amb botó de ràdio, títol en negreta i descripció, dins d'un grup (com s'ha fet).
      B: Un component nou «opció amb descripció» al sistema de disseny (tokens.css i design-system.md).
      C: «segmentat» per triar i la descripció de l'opció triada a sota.
    recomanada: A
    perque: >-
      Fa la feina amb components que ja existeixen i és accessible. Si la sessió de disseny vol una peça pròpia (B), les plantilles només canvien de classe.
    data: 2026-11-16
  P-131:
    opcions:
      A: Només de lectura a l'app; els valors es canvien a la configuració del servidor amb un desplegament.
      B: L'administrador els canvia a l'app, amb TOTP, nota i registre, com els permisos (059).
      C: Com la B, però activar la targeta guardada també demana l'autorització de la junta.
    recomanada: A
    perque: >-
      Activar un mètode de pagament canvia el que veu un soci real i depèn del contracte amb el proveïdor; un canvi de configuració revisat és més segur. Es pot passar a B quan hi hagi proveïdor triat.
    data: 2026-11-16
  P-132:
    opcions:
      A: Com revocar el mandat; confirmació, contrasenya si la sessió té més de 15 minuts i «pagar cada vegada».
      B: Confirmació sense contrasenya; «pagar cada vegada».
      C: Confirmació i contrasenya sempre (com esborrar el compte).
    recomanada: A
    perque: >-
      Fa servir la mateixa regla que les altres accions sobre el mètode de pagament (RN-M05a-12) i el soci no queda mai sense mètode definit.
    data: 2026-11-16
  P-133:
    opcions:
      A: Motiu obligatori i registre, sense tornar a demanar el codi TOTP.
      B: Motiu i el codi TOTP a la mateixa petició, com aprovar un esborrat RGPD.
    recomanada: A
    perque: >-
      La revocació és a petició del soci i no mou diners; el compte d'administrador ja ha entrat amb TOTP. Si la junta la vol tractar com una acció irreversible, la B.
    data: 2026-11-16
  P-134:
    opcions:
      A: El mandat es queda actiu sense fer-se servir; la remesa segueix la preferència i la pantalla diu com revocar-lo.
      B: Triar «pagar cada vegada» revoca el mandat sol, amb el motiu «canvi de mètode».
      C: Preguntar-ho al soci en el moment de triar (revocar-lo o no).
    recomanada: C
    perque: >-
      El soci decideix i no queda cap mandat oblidat. Mentre no es respongui, la A no cobra ningú per domiciliació contra la seva tria.
    data: 2026-11-16
  P-135:
    opcions:
      A: El tresorer la tanca amb un botó i confirmació; tancar-la atura els recordatoris.
      B: Es tanca sola quan el tresorer fixa la primera remesa.
      C: No es tanca mai; una campanya nova substitueix l'anterior.
    recomanada: A
    perque: >-
      És la més simple i deixa la decisió al tresorer; el camp «closed_at» ja existeix.
    data: 2026-11-16
  P-123:
    opcions:
      A: Qualsevol IBAN vàlid (format i dígits de control), com s'ha construït.
      B: Només IBAN espanyols (ES) fins que el banc confirmi la zona SEPA que admet.
      C: La llista de països SEPA que doni el banc, com a dada editable a «Ajustos».
    recomanada: C
    perque: >-
      És una llista de negoci, i la regla del projecte la vol com a dada. Mentre el banc no respongui, la signatura
      continua apagada a producció i la A no arriba a cap soci real.
    data: 2026-11-16
  P-124:
    opcions:
      A: Soci actiu o impagat, amb número (com s'ha construït).
      B: Només el soci actiu.
      C: També el soci pendent amb número (readmissió), perquè la primera quota ja vagi domiciliada.
    recomanada: A
    perque: >-
      Un soci impagat que vol domiciliar la quota és el cas que més ho necessita; el pendent encara no té número.
    data: 2026-11-16
  P-125:
    opcions:
      A: Signar no toca la preferència; la canvia la pantalla del mètode (T-M05a-11), com s'ha construït.
      B: Signar posa la preferència a «domiciliació» amb aquest mandat.
      C: Signar la canvia només si el soci no en tenia cap.
    recomanada: B
    perque: >-
      Qui signa un mandat vol pagar per domiciliació; amb la A podria quedar un mandat actiu que la remesa no fa servir.
      La B és una línia a la T-M05a-11, que és qui toca `preferences.py`.
    data: 2026-11-16
  P-126:
    opcions:
      A: No compta com a intent fallit si el formulari no portava el camp (com s'ha construït).
      B: Compta sempre, com una contrasenya buida a qualsevol altre formulari de reautenticació.
    recomanada: A
    perque: >-
      El soci no ha pogut escriure cap contrasenya; comptar-ho el podria bloquejar sense haver-se equivocat. Una
      contrasenya buida escrita al camp sí que compta.
    data: 2026-11-16
  P-127:
    opcions:
      A: Revocar sempre funciona; amb la signatura apagada, la pàgina només surt a qui té un mandat actiu (com s'ha construït).
      B: Com la A, i el menú també mostra «Mandat de domiciliació» a qui té un mandat actiu.
      C: Amb la signatura apagada, només el tresorer revoca, a petició escrita (A6).
    recomanada: B
    perque: >-
      Un soci ha de poder retirar l'autorització sobre el seu compte quan vulgui, sense dependre d'un correu antic.
      La B és la A més una línia al menú, que és de la sessió de disseny.
    data: 2026-11-17
  P-128:
    opcions:
      A: Només passa a «pagar cada vegada» si era la domiciliació o no n'hi havia cap; la targeta guardada es manté (com s'ha construït).
      B: Sempre passa a «pagar cada vegada», com diu P-M05a-C literalment.
    recomanada: A
    perque: >-
      Revocar el mandat no diu res de la targeta; canviar-la sense que el soci ho demani faria fallar un cobrament que
      el soci esperava.
    data: 2026-11-17

  P-112:
    opcions:
      A: Com s'ha construït; només el Tresorer. L'Administrador se'l pot donar des de l'editor de permisos si cal.
      B: El Tresorer i l'Administrador des del principi.
      C: L'Administrador només per desfer (la 045), no per confirmar.
    recomanada: A
    perque: >-
      RN-T16 diu que només el tresorer confirma una conciliació, i el M04-4 tracta el tresorer com una sola persona.
      Si el tresorer falta, l'Administrador es pot donar el permís en un minut, i el canvi queda al registre amb nota
      i TOTP; donar-lo d'entrada vol dir que un compte més pot marcar quotes com a pagades.
    data: 2026-11-16

  P-121:
    opcions:
      A: Com s'ha construït; el·lipsi, «ES … 1234», sense cap caràcter prohibit.
      B: Asteriscs amb els grups de RN-M05a-06, «ES** **** **** **** **** 1234».
      C: Mantenir «•» i treure U+2022 de la llista de la prova dels punts volats (es perd la protecció contra «l•l»).
      D: Mantenir «•» només a les plantilles, escrit com a entitat HTML («&bull;»), i deixar la prova com està.
    recomanada: A
    perque: >-
      No toca la prova que protegeix el punt volat i amaga el mateix: el país i els quatre darrers dígits. La B és
      equivalent si es vol conservar la llargada visual dels grups; la C afebleix una prova que ja ha trobat errors.
    data: 2026-11-16

  P-122:
    opcions:
      A: Com s'ha construït; l'intent passa de «pagat» a «cancel·lat» i el rebut s'anul·la amb una nota (fila nova).
      B: Un estat nou de l'intent, «revertit», per distingir-lo d'un intent cancel·lat abans de pagar.
      C: L'intent es queda «pagat» i l'índex «un sol pagat per càrrec» exclou els intents amb el pagament anul·lat.
      D: L'intent passa «a revisar» amb el motiu i el tresorer el tanca a mà (T-M05b-16).
    recomanada: A
    perque: >-
      Fa servir un estat que ja és a la llista de M05b-6 i el rebut no es toca, com diu la 045. La C deixaria dos
      intents «pagats» per al mateix càrrec i el rebut antic semblaria vàlid; la D obligaria el tresorer a fer dues
      vegades la mateixa correcció.
    data: 2026-11-16

  P-136:
    opcions:
      A: Triar targeta o Bizum deixa la transferència «abandonada», amb avís a la pantalla (com s'ha fet).
      B: El nou mètode espera fins que la transferència arribi o torni a «pendent» (P-139).
      C: Com la A, però el soci ha de confirmar que encara no ha fet la transferència.
    recomanada: A
    perque: >-
      La B deixaria el soci sense cap altra manera de pagar durant setmanes. Un pagament doble ja el detecta la
      conciliació (LT6) i es torna; la C afegeix un pas que no evita res que la A no avisi.
    data: 2026-11-16
  P-137:
    opcions:
      A: Càrrec pagat, sense rebut, i una entrada al registre perquè el tresorer ho vegi (com s'ha fet).
      B: Esperar que la targeta o el Bizum acabin i llavors emetre el rebut de la transferència.
      C: Deixar la targeta o el Bizum «abandonats» i emetre el rebut de seguida.
    recomanada: B
    perque: >-
      El soci ha de tenir el rebut del que ha pagat. Amb la B ningú no toca un intent del proveïdor que encara pot
      arribar; la A és la base segura mentre no es construeix.
    data: 2026-11-16
  P-138:
    opcions:
      A: Les plantilles no canvien.
      B: Pas 2 «Confirmació del pagament» per a tots els mètodes, i al rebut la referència de la transferència.
      C: Pas 2 propi per a la transferència («Arriba al banc del club») i la referència al rebut.
    recomanada: C
    perque: >-
      El text ha de dir qui confirma cada pagament, i RN-M05b-19 demana la referència al rebut. És feina de la
      sessió de disseny, que és la propietària de les dues plantilles.
    data: 2026-11-16
  P-139:
    opcions:
      A: Ara no caduca res; la transferència espera fins que arriba o el soci tria un altre mètode.
      B: Tasca nova al 05b; als 30 dies (`transfer_reminder_days`), «pendent» i un recordatori amb un text de la junta.
      C: Com la B, però sense tornar a «pendent»; només el recordatori.
    recomanada: B
    perque: >-
      És el que diu P-M05b-C, pas 4. Amb la P-136, el soci no queda bloquejat mentrestant, i per això la A és una
      base segura fins que hi hagi tasca.
    data: 2026-11-16

  P-190:
    opcions:
      A: Dos codis nous al catàleg del nucli (T8 i T10), amb les cel·les de la matriu, en una tasca del nucli.
      B: Excloure amb T4 i la llista amb T1, sense cap codi nou (com s'ha fet).
      C: Com la B ara, i passar a la A quan algú hagi de tenir T4 sense T8 (o T1 sense T10).
    recomanada: C
    perque: >-
      Avui les cel·les inicials són idèntiques i un codi nou tocaria el nucli, que té feina oberta en paral·lel.
      La B ja és tancada (cap rol nou no hi entra); la separació només cal si la junta vol rols diferents.
    data: 2026-11-16
  P-191:
    opcions:
      A: Només les línies de l'extracte; cada mena de pagament es revisa a la seva pantalla.
      B: Les línies ara; els intents del 05b s'hi afegeixen quan la T-M05b-16 doni un servei de lectura.
      C: Una llista única amb línies, intents del 05b, quotes d'A-17 i cobraments de liquidacions.
    recomanada: B
    perque: >-
      Respecta l'ordre dels mòduls (la 04 no depèn del 05b) i compleix CA-T13.1 quan el 05b existeixi. La C
      duplicaria la pantalla de quotes, que ja té A-17.
    data: 2026-11-16
  P-192:
    opcions:
      A: Només una línia pendent; una exclusió no es desfà (com s'ha fet).
      B: També una línia proposada; una exclusió no es desfà.
      C: Com la B, i el tresorer pot desfer una exclusió amb motiu (torna a pendent, amb registre).
    recomanada: C
    perque: >-
      Una proposta només és un suggeriment i el pas 3 de P-M04-E ja preveu excloure-la. Desfer amb motiu evita
      que un error del tresorer quedi per sempre; no mou diners. La A és la lectura literal de RN-T15.
    data: 2026-11-16

  P-193:
    opcions:
      A: La Secretaria no hi té accés (com s'ha fet).
      B: La Secretaria hi té «Cons.»: només veu «té mètode: sí/no», sense mètode, mandat, targeta ni IBAN.
      C: La Secretaria ho veu tot, com el tresorer, amb l'IBAN emmascarat.
    recomanada: B
    perque: >-
      És el que proposa el M05a-4 i li serveix per avisar els socis sense mètode sense veure cap dada bancària.
      Mentre la junta no ho aprovi, la A és la base segura; la C dona més dades bancàries de les que cal.
    data: 2026-11-16

  P-113:
    opcions:
      A: Com s'ha construït; torna a pendent, es torna a calcular i, amb la mateixa referència, es torna a proposar.
      B: Torna a pendent i no es torna a proposar mai amb els càrrecs de la conciliació desfeta.
      C: Torna a pendent i va «a revisar» amb el motiu «conciliació desfeta», sense proposta, fins que el tresorer la casi o l'exclogui.
    recomanada: C
    perque: >-
      Si el pagador va escriure la referència d'una altra persona, la proposta tornarà a ser la mateixa i el tresorer
      la tornaria a confirmar per error. La C ho deixa a la llista que el tresorer ja mira, amb el motiu, i permet
      excloure-la; és un canvi petit al recàlcul, que es pot fer en qualsevol moment perquè l'estat es torna a calcular.
    data: 2026-11-16

  P-114:
    opcions:
      A: Com s'ha construït; una pota de traspàs no s'anul·la. Un traspàs equivocat es corregeix amb un traspàs de sentit contrari.
      B: Anul·lar una pota anul·la les dues alhora, amb el mateix motiu.
      C: Cada pota s'anul·la per separat.
    recomanada: A
    perque: >-
      Un traspàs de sentit contrari ja és un servei del pla (P-M04-D), queda enllaçat i es concilia amb l'extracte com
      qualsevol altre. La B és raonable però és codi nou sobre diners; la C deixa els dos comptes desquadrats.
    data: 2026-11-16

  P-115:
    opcions:
      A: Com s'ha construït; un contramoviment no s'anul·la. Una anul·lació equivocada es corregeix amb un moviment nou amb motiu.
      B: Un contramoviment es pot anul·lar (un contramoviment del contramoviment), amb motiu.
    recomanada: A
    perque: >-
      Una cadena d'anul·lacions fa difícil saber si un moviment compta o no (RN-T25 diu «anul·lat» si té contramoviment)
      i el marge del 09 llegeix aquest estat. Amb la A, l'estat d'un moviment sempre és d'un sol pas.
    data: 2026-11-16

  P-118:
    opcions:
      A: Com s'ha construït; devolucions i retorn sumen junts fins a l'import cobrat. Després d'un retorn, cap devolució; amb devolucions, el retorn es rebutja i va «a revisar».
      B: El retorn no compta amb les devolucions; cadascun té el seu límit.
      C: El retorn s'apunta sempre, i si amb les devolucions passa de l'import, la diferència va «a revisar».
    recomanada: A
    perque: >-
      Amb la B es podria tornar dues vegades el mateix import (una devolució i un retorn del banc) sense que res avisés.
      La C és la més fidel al banc però apunta més sortides que diners cobrats; la A atura el cas estrany perquè el
      tresorer el miri, que és rar i ha de ser a mà.
    data: 2026-11-17

  P-119:
    opcions:
      A: Com s'ha construït; cada crida apunta una devolució, el límit de l'import cobrat i el pany del pagament n'eviten l'excés, i el 05b la crida una vegada per devolució.
      B: Afegir un identificador de la devolució al moviment (migració) i tornar l'existent si es repeteix.
      C: Rebutjar dues devolucions del mateix import el mateix dia.
    recomanada: B
    perque: >-
      Una repetició del 05b (un reintent després d'un error) podria apuntar dues vegades una devolució parcial, i el
      límit només l'atura si passa de l'import. La B ho resol del tot amb poc codi; la C rebutjaria casos legítims.
      Fins que es decideixi, la A no deixa mai tornar més del cobrat.
    data: 2026-11-17

  P-220:
    opcions:
      A: Com s'ha construït; no s'apunta res i no es pot confirmar fins que es resolgui a mà (tall següent).
      B: Es poden confirmar les partides conegudes; la resta queda pendent.
      C: S'espera que el proveïdor l'enviï corregida, amb un altre identificador.
    recomanada: A
    perque: >-
      Amb la B el net no quadraria amb l'abonament del banc. La A no apunta diners a mitges; amb la pantalla, el
      tresorer la podrà casar a mà amb els cobraments del període (RN-T21).
    data: 2026-11-17

  P-221:
    opcions:
      A: Com s'ha construït; la comissió porta la data de l'ingrés.
      B: La comissió porta la data de la liquidació.
    recomanada: A
    perque: >-
      La despesa queda al mes del cobrament que la genera, arribi amb la notificació o amb la liquidació.
    data: 2026-11-17

  P-194:
    opcions:
      A: Sense cap cobrament, des de la signatura; caduca el dia que es compleixen els 36 mesos (com s'ha fet).
      B: Sense cap cobrament, des de la signatura; caduca l'endemà de complir-se els 36 mesos.
      C: Un mandat que no s'ha cobrat mai no caduca fins al primer cobrament.
      D: Sense cap cobrament, des de la data de la primera remesa prevista.
    recomanada: A
    perque: >-
      Un mandat que no es fa servir mai no pot quedar actiu per sempre, i la signatura és l'única data segura.
      Caducar el mateix dia és la lectura prudent: si el banc admet aquell dia, només cal passar a la B.
    data: 2026-11-16

  P-195:
    opcions:
      A: La preferència no es toca; sense mandat actiu, la quota es paga com a RN-M05a-15 (com s'ha fet).
      B: La preferència passa a «pagar cada vegada», amb registre.
      C: S'esborra la preferència (el soci torna a «sense resposta») i entra a la campanya següent.
    recomanada: A
    perque: >-
      No canvia cap dada que el soci hagi triat i el resultat per cobrar és el mateix que la B: sense mandat actiu
      no hi ha domiciliació. En signar-ne un de nou, la preferència es torna a lligar al mandat nou (T-M05a-09 i 11).
    data: 2026-11-16

  P-196:
    opcions:
      A: Només la capacitat del proveïdor (`capabilities().tokenization`) ara; amb `ProviderConfig`, totes dues (com s'ha fet).
      B: Un paràmetre de l'entorn per activar-la, a més de la capacitat del proveïdor.
      C: No oferir-la fins que existeixi `ProviderConfig` amb `tokenization_enabled`.
    recomanada: A
    perque: >-
      No cal cap paràmetre nou i el proveïdor fals ja diu que no. Avui la C dona el mateix resultat; la diferència
      només apareix amb un proveïdor real que tokenitzi abans de fer `ProviderConfig`.
    data: 2026-11-16

  P-197:
    opcions:
      A: No es desa res i es porta a signar el mandat; després, el soci torna a triar (com s'ha fet).
      B: Signar el mandat des d'aquest flux deixa la preferència a «domiciliació» (és respondre que sí a la P-125 només aquí).
      C: Es desa una preferència «domiciliació pendent de mandat» (cal un estat nou i una migració).
    recomanada: B
    perque: >-
      Per al soci, triar domiciliació i signar és un sol pas; tornar a triar és un pas de més. Mentre la P-125 no
      es respongui, la A no desa cap preferència sense mandat ni canvia res que el soci no hagi triat.
    data: 2026-11-16

  P-198:
    opcions:
      A: El mateix enllaç per a tothom; sense compte, porta a l'entrada i cal activar-lo per una altra via (com s'ha fet).
      B: Als socis sense compte, la invitació porta l'enllaç d'activació del compte (cal un servei d'accounts).
      C: Als socis sense compte, només l'avís en persona de la secretaria.
    recomanada: B
    perque: >-
      Amb la B el soci fa un sol clic. Cal un servei nou a `apps/accounts` que generi l'enllaç; mentre no hi
      és, la A funciona sense tocar el nucli.
    data: 2026-11-17

  P-199:
    opcions:
      A: No es convida; surt a «sense resposta» i l'atén la secretaria (com s'ha fet).
      B: Es registra com a convidat «sense correu» perquè surti apart al recompte (cal un camp o una migració).
      C: Es convida el representant o el contacte d'emergència.
    recomanada: A
    perque: >-
      No inventa cap adreça ni cap camp, i la pantalla de la campanya pot comptar els sense correu sense desar
      res més.
    data: 2026-11-17

  P-210:
    opcions:
      A: Un sol recordatori; els que tocaven es donen per enviats (com s'ha fet).
      B: Un recordatori per dia fins a posar-se al dia.
      C: Tots els que tocaven, el mateix dia.
    recomanada: A
    perque: >-
      Ningú no rep dos correus seguits pel mateix motiu, i l'últim recordatori arriba igualment.
    data: 2026-11-17

  P-211:
    opcions:
      A: Una sola campanya oberta; per obrir-ne una altra, es tanca l'anterior (com s'ha fet).
      B: Diverses obertes alhora, i cada soci rep les invitacions de cadascuna.
    recomanada: A
    perque: >-
      Evita que un soci rebi invitacions duplicades; tornar a enviar ja convida els socis nous.
    data: 2026-11-17

  P-212:
    opcions:
      A: Cal A4 per entrar; amb A5 sense A4, «no trobat» (com s'ha fet).
      B: Amb A5 sense A4 s'entra a la pantalla, però sense cap recompte.
      C: A5 implica A4 (l'editor de permisos no deixa donar A5 sense A4).
    recomanada: A
    perque: >-
      Els recomptes són dades de pagament d'A4 i la matriu inicial dona tots dos permisos als mateixos rols.
      La C és la més clara per a l'administrador, però toca l'editor de permisos del nucli.
    data: 2026-11-17

  P-213:
    opcions:
      A: Abans del nivell 2, l'anonimització crida un servei del 05a que bloqueja els mandats actius (com es proposa).
      B: El 05b no cobra mai un mandat d'una persona anonimitzada (comprovació a la remesa), sense canviar l'estat.
      C: Totes dues.
    recomanada: C
    perque: >-
      La A deixa l'estat coherent amb L-M05a-06 i la B és la xarxa de seguretat al punt on es mouen diners.
      Cap de les dues no és urgent mentre no hi hagi remeses.
    data: 2026-11-17

  P-240:
    opcions:
      A: En registrar el retorn, el pagament queda anul·lat amb el motiu del banc i només el tresorer el registra (com s'ha fet).
      B: El pagament continua comptant i el mòdul 01 només compta els pagaments posteriors a l'últim retorn (canvi al 01).
      C: El pagament s'anul·la en reobrir el càrrec, no en retornar-lo.
      D: Un estat «retornat» al pagament de la 00, que també admet el sistema com a autor (canvi de model).
    recomanada: A
    perque: >-
      Fa servir l'anul·lació que ja existeix (045), sense canviar cap model ni el 01, i un càrrec reobert i tornat a
      pagar té un sol pagament que compta. La D només cal si els retorns s'han de registrar sols, sense el tresorer.
    data: 2026-11-17

noves:
