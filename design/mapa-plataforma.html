<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mapa de la plataforma C.R.I.S.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fosca com el tauler del club + àrea de lectura clara; les zones es distingeixen per color */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface2:#f7f9fb; --ink:#0f1c2a; --muted:#566676; --line:#dbe3ea;
  --link:#0b5f8f; --accent:#f5c43a; --accent-ink:#3d2e00;
  --side:#062a47; --side2:#0b3a5e; --side-ink:#cfe0ee; --side-muted:#8fb0c9;
  --z-pub:#0f8496; --z-pub-bg:#e2f4f6; --z-soc:#9a6b12; --z-soc-bg:#fbf1da; --z-adm:#2a4f86; --z-adm-bg:#e5ecf7;
  --ok:#1b8a5e; --ok-bg:#e1f3ea; --warn:#a8650d; --warn-bg:#fcefd9; --bad:#c0392f; --bad-bg:#fbe5e2; --info:#0b5f8f; --info-bg:#e3eff7;
  --sys:#6b5aa8; --sys-bg:#ece9f7;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(6,42,71,.06),0 6px 20px rgba(6,42,71,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08131e; --surface:#0f1f2f; --surface2:#132638; --ink:#e4edf5; --muted:#93a7b9; --line:#22384d;
  --link:#74c4ea; --accent:#f5c43a; --accent-ink:#2b2000;
  --side:#04101b; --side2:#0b2236; --side-ink:#cfe0ee; --side-muted:#7f9db5;
  --z-pub:#4cc3d3; --z-pub-bg:#0f3139; --z-soc:#e2b04f; --z-soc-bg:#33270e; --z-adm:#8fb2ec; --z-adm-bg:#18294a;
  --ok:#55c995; --ok-bg:#0f3123; --warn:#f0b056; --warn-bg:#36260b; --bad:#f2857b; --bad-bg:#3a1714; --info:#74c4ea; --info-bg:#0f2c40;
  --sys:#b3a6ef; --sys-bg:#231e3d; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08131e; --surface:#0f1f2f; --surface2:#132638; --ink:#e4edf5; --muted:#93a7b9; --line:#22384d;
  --link:#74c4ea; --accent:#f5c43a; --accent-ink:#2b2000;
  --side:#04101b; --side2:#0b2236; --side-ink:#cfe0ee; --side-muted:#7f9db5;
  --z-pub:#4cc3d3; --z-pub-bg:#0f3139; --z-soc:#e2b04f; --z-soc-bg:#33270e; --z-adm:#8fb2ec; --z-adm-bg:#18294a;
  --ok:#55c995; --ok-bg:#0f3123; --warn:#f0b056; --warn-bg:#36260b; --bad:#f2857b; --bad-bg:#3a1714; --info:#74c4ea; --info-bg:#0f2c40;
  --sys:#b3a6ef; --sys-bg:#231e3d; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2.6rem}
h2{font-size:1.65rem;margin-bottom:.6rem}
h3{font-size:1.2rem}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--muted)}
.eyebrow{font:600 .74rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---- Estructura ---- */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px 30px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 16px;color:#fff}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px;flex:none}
.brand b{display:block;font:700 1.35rem/1 var(--f-disp);letter-spacing:.03em}
.brand small{color:var(--side-muted);font-size:.8rem}
.search{width:100%;border:1px solid var(--side2);background:var(--side2);color:#fff;border-radius:8px;padding:9px 12px;font:inherit;font-size:.95rem}
.search::placeholder{color:var(--side-muted)}
.navgrp{margin-top:18px}
.navgrp>.eyebrow{color:var(--side-muted);padding:0 8px 6px;display:block}
.nav a,.nav summary{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--side-ink);font-size:.95rem;cursor:pointer;text-decoration:none}
.nav a:hover,.nav summary:hover{background:var(--side2)}
.nav a.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav .cnt{margin-left:auto;font:500 .72rem var(--f-mono);color:var(--side-muted)}
.nav a.on .cnt{color:var(--accent-ink)}
.nav details summary{list-style:none}
.nav details summary::-webkit-details-marker{display:none}
.nav details summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;opacity:.7}
.nav details[open] summary::before{transform:rotate(45deg)}
.nav .modnum{font:600 .75rem var(--f-mono);color:var(--accent);width:18px;text-align:right;flex:none}
.nav .sub a{padding-left:42px;font-size:.88rem}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.pub{background:var(--z-pub)}.dot.soc{background:var(--z-soc)}.dot.adm{background:var(--z-adm)}
.side .dot.pub{background:#4cc3d3}.side .dot.soc{background:#e2b04f}.side .dot.adm{background:#8fb2ec}
.sres a{display:block;padding:7px 9px;border-radius:7px;color:var(--side-ink);font-size:.92rem}
.sres a:hover{background:var(--side2);text-decoration:none}
.sres small{display:block;color:var(--side-muted);font-size:.76rem}

.main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:30;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:#fff;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--side)}
  .topbar button{background:var(--side2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:600 .9rem var(--f-body)}
  .topbar b{font:700 1.15rem var(--f-disp);letter-spacing:.03em}
  h1{font-size:2.05rem}
}

/* ---- Components comuns ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.sec{margin-top:34px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.z-pub{color:var(--z-pub);background:var(--z-pub-bg);border-color:transparent}
.z-soc{color:var(--z-soc);background:var(--z-soc-bg);border-color:transparent}
.z-adm{color:var(--z-adm);background:var(--z-adm-bg);border-color:transparent}
.r-sys{color:var(--sys);background:var(--sys-bg);border-color:transparent}
.tag{font:600 .7rem/1 var(--f-mono);letter-spacing:.04em;padding:4px 7px;border-radius:5px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.tag.soft{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.crumbs span.sep{opacity:.5}
.lead{font-size:1.1rem;max-width:68ch;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:8px 14px;font:600 .92rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--link);text-decoration:none}
.btn.pri{background:var(--side);color:#fff;border-color:var(--side)}
.btn[disabled]{opacity:.4;cursor:default}
.olist{list-style:none;margin:0;padding:0;counter-reset:n}
.olist li{counter-increment:n;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.olist li:first-child{border-top:0}
.olist li::before{content:counter(n);font:600 .8rem/26px var(--f-mono);width:26px;height:26px;text-align:center;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.olist b{display:block}
.plain{list-style:none;margin:0;padding:0}
.plain li{padding:6px 0;border-top:1px solid var(--line)}
.plain li:first-child{border-top:0}
.pend{color:var(--warn)}
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.9rem}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.yes{color:var(--ok);font-weight:600}.no{color:var(--muted)}.part{color:var(--warn);font-weight:600}

/* ---- Inici ---- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero img{width:120px;height:auto;background:#fff;border-radius:50%;padding:6px}
@media (max-width:600px){.hero{grid-template-columns:1fr}.hero img{display:none}}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:20px}
.stat b{display:block;font:700 2.3rem/1 var(--f-disp);color:var(--ink)}
.stat span{font-size:.85rem;color:var(--muted)}
.how{counter-reset:h;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.how b{display:block;margin-bottom:2px}
.zcol{border-top:4px solid var(--zc);background:var(--surface);border-radius:0 0 12px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px}
.zcol h3{color:var(--zc)}
.zcol .mg{margin-top:12px}
.zcol .mg .eyebrow{display:block;margin-bottom:4px}
.zcol a{display:block;padding:3px 0;font-size:.95rem}
.modcard{display:block;color:inherit}
.modcard:hover{text-decoration:none;border-color:var(--link)}
.modcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.modcard .num{font:700 2rem/1 var(--f-disp);color:var(--muted)}
.modcard p{margin:.4rem 0 .6rem;font-size:.93rem;color:var(--muted)}

/* ---- Pantalla d'exemple (mock) ---- */
.frame{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.fbar i{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.fbar .url{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font:12px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fzone{font:600 .7rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;color:#fff}
.fzone.pub{background:var(--z-pub)}.fzone.soc{background:var(--z-soc)}.fzone.adm{background:var(--z-adm)}
:root[data-theme="dark"] .fzone{color:#08131e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fzone{color:#08131e}}
.mock{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:.88rem}
.mock .mh b{display:block;font:700 1.35rem/1.15 var(--f-disp)}
.mock .mh span{color:var(--muted);font-size:.85rem}
.mock .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.mock .kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface2)}
.mock .kpi small{display:block;color:var(--muted);font-size:.74rem}
.mock .kpi b{font:700 1.1rem var(--f-disp)}
.mock .kpi.ok b{color:var(--ok)}.mock .kpi.warn b{color:var(--warn)}.mock .kpi.bad b{color:var(--bad)}
.mock .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mock .filters .f{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.8rem;background:var(--surface2)}
.mock .filters .s{flex:1;min-width:120px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.8rem;color:var(--muted)}
.mock table{border-collapse:collapse;width:100%;font-size:.82rem}
.mock th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);font-weight:600}
.mock td{padding:6px 7px;border-bottom:1px solid var(--line)}
.mock .tw{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.74rem;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.mock .fm{display:grid;gap:8px}
.mock .fm label{display:grid;gap:2px;font-size:.76rem;color:var(--muted)}
.mock .fm .in{border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--ink);font-size:.86rem;background:var(--surface);min-height:30px}
.mock .fm .in.area{min-height:52px}
.mock .fm .in.sel::after{content:" ▾";color:var(--muted)}
.mock .ck{display:flex;gap:8px;align-items:center;font-size:.84rem}
.mock .ck::before{content:"";width:14px;height:14px;border-radius:3px;background:var(--link);flex:none}
.mock .mbtns{display:flex;flex-wrap:wrap;gap:6px}
.mbtn{display:inline-block;border-radius:7px;padding:6px 11px;font-size:.82rem;font-weight:600;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
a.mbtn{box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
a.mbtn:hover{text-decoration:none;box-shadow:0 0 0 2px var(--accent)}
a.mbtn::after{content:" →";opacity:.6}
.mbtn.p{background:var(--side);border-color:var(--side);color:#fff}
.mbtn.d{color:var(--bad);border-color:var(--bad)}
span.mbtn{opacity:.75}
.mock .alert{border-radius:8px;padding:8px 10px;font-size:.84rem;border-left:3px solid}
.alert.ok{background:var(--ok-bg);border-color:var(--ok)}.alert.warn{background:var(--warn-bg);border-color:var(--warn)}.alert.bad{background:var(--bad-bg);border-color:var(--bad)}.alert.info{background:var(--info-bg);border-color:var(--info)}
.mock .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mock .mc{border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);background:var(--surface2);display:block}
.mock a.mc:hover{text-decoration:none;border-color:var(--accent)}
.mock .mc b{display:block;font-size:.88rem}
.mock .mc span{font-size:.78rem;color:var(--muted)}
.mock .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.mock .tabs span{padding:5px 10px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.mock .tabs span.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent)}
.mock .stp{display:flex;gap:4px;flex-wrap:wrap}
.mock .stp span{font-size:.74rem;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.mock .stp span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.mock .stp span.done{color:var(--ok)}
.mock .split{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.mock .split>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.mock .cal{display:grid;gap:4px}
.mock .cal div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.mock .cal b{font:500 .78rem var(--f-mono);color:var(--link)}
.mock .chl div{display:grid;grid-template-columns:96px minmax(0,1fr) 60px;gap:8px;align-items:center;font-size:.8rem;margin:4px 0}
.mock .chl i{display:block;height:12px;border-radius:3px;background:var(--z-adm)}
.mock .chl em{font-style:normal;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:right}
.mock .li{display:grid;gap:4px}
.mock .li div{display:flex;gap:8px;align-items:center}
.mock .li div::before{content:"";width:12px;height:12px;border-radius:3px;border:1.5px solid var(--muted);flex:none}
.mock .li div.y::before{background:var(--ok);border-color:var(--ok)}
.mock .li div.n::before{border-color:var(--bad)}
.mock .up{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:.82rem}
.mock .choice{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mock .choice div{border:1px solid var(--line);border-radius:8px;padding:8px}
.mock .choice div.on{border:2px solid var(--accent)}
.mock .choice b{display:block}
.mock .hero{display:block;background:linear-gradient(160deg,#0a3f63,#062a47);color:#fff;border-radius:8px;padding:18px}
.mock .hero b{display:block;font:700 1.5rem/1.1 var(--f-disp)}
.mock .hero p{margin:4px 0 10px;color:#cfe3f2}
.mock .hero .mbtn{background:#fff;color:#062a47;border-color:#fff}
.mock .hero .mbtn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.carnet{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;background:linear-gradient(140deg,#0b4d74,#062a47);color:#fff;border-radius:12px;padding:14px 16px;max-width:380px}
.carnet .ct{display:flex;gap:8px;align-items:center;font:700 1rem var(--f-disp);letter-spacing:.04em}
.carnet .ct img{width:28px;height:28px;border-radius:50%;background:#fff;padding:2px}
.carnet .nm{font:700 1.25rem/1.1 var(--f-disp);margin-top:10px}
.carnet small{display:block;color:#cfe3f2;font-size:.76rem}
.carnet .badge{display:inline-block;margin-top:8px;background:var(--accent);color:#3d2e00;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
.carnet svg{background:#fff;border-radius:6px;padding:4px;width:96px;height:96px}

/* ---- Pàgina: fitxa ---- */
.phead{display:grid;gap:10px}
.pgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:22px}
@media (max-width:1050px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,.8fr) 36px minmax(0,1fr);align-items:start;gap:8px}
.flow .arr,.flow .me{margin-top:22px}
.flow .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.flow .col .eyebrow{margin-bottom:2px}
.flow .arr{text-align:center;color:var(--muted);font:600 1.4rem var(--f-mono)}
.flow .me{background:var(--side);color:#fff;border-radius:10px;padding:14px;text-align:center}
.flow .me b{display:block;font:700 1.2rem/1.1 var(--f-disp)}
.flow .me small{color:var(--side-muted);font:.75rem var(--f-mono);word-break:break-all}
.lnk{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);font-size:.9rem}
.lnk:hover{text-decoration:none;border-color:var(--link)}
.lnk .dot{margin-top:7px}
.lnk small{display:block;color:var(--muted);font-size:.78rem}
.empty{font-size:.85rem;color:var(--muted);font-style:italic}
@media (max-width:700px){.flow{grid-template-columns:minmax(0,1fr)}.flow .arr{transform:rotate(90deg)}}
.pnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:34px}

/* ---- Processos ---- */
.swim{border-collapse:separate;border-spacing:0;font-size:.85rem}
.swim th{position:sticky;left:0;background:var(--surface);text-align:left;padding:6px 12px 6px 0;font-weight:600;white-space:nowrap;z-index:1}
.swim td{padding:3px;text-align:center;border-left:1px dashed var(--line)}
.swim thead td{font:500 .72rem var(--f-mono);color:var(--muted);border-left:0}
.swim button{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;font:600 .75rem var(--f-mono);color:#fff;background:var(--z-adm)}
.swim button.sys{background:var(--sys)}
.swim button.on{box-shadow:0 0 0 3px var(--accent)}
.pgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:18px}
@media (max-width:1050px){.pgrid2{grid-template-columns:minmax(0,1fr)}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.steps li button:hover{border-color:var(--link)}
.steps li button:focus-visible{outline:2px solid var(--accent)}
.steps li.on button{border:2px solid var(--accent);background:var(--surface2)}
.steps .n{font:600 .8rem/28px var(--f-mono);width:28px;height:28px;text-align:center;border-radius:50%;background:var(--side);color:#fff}
.steps .sys .n{background:var(--sys)}
.steps .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:.8rem}
.sticky{position:sticky;top:16px}
.stepnav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}
.proccard{display:block;color:inherit}
.proccard:hover{text-decoration:none;border-color:var(--link)}
.proccard .cnt{font:500 .75rem var(--f-mono);color:var(--muted)}

/* ---- Mapa de connexions ---- */
.mapwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.mapsvg{display:block;min-width:900px;width:100%;height:auto}
.mapsvg .edge{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .15s,opacity .15s}
.mapsvg .edge.ext{stroke-dasharray:5 5}
.mapsvg.hl .edge{opacity:.15}
.mapsvg.hl .edge.on{opacity:1;stroke:var(--accent);stroke-width:3}
.mapsvg .node{cursor:pointer}
.mapsvg .node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.mapsvg .node:hover rect,.mapsvg .node.on rect{stroke:var(--accent);stroke-width:3}
.mapsvg .node text{fill:var(--ink);font-family:var(--f-body);font-size:14px;font-weight:600}
.mapsvg .node text.n{fill:var(--muted);font-family:var(--f-mono);font-size:11px;font-weight:500}
.mapsvg .node.must rect{fill:var(--z-adm-bg)}
.mapsvg .node.ext rect{fill:var(--surface2);stroke-dasharray:4 4}
.mapsvg .node.ext text{fill:var(--muted);font-weight:500}
.mapsvg .base rect{fill:var(--side)}
.mapsvg .base text{fill:#fff;font-family:var(--f-body);font-size:14px}
.mapsvg .base text.b{font-weight:700}
.relpanel{margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.85rem;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:12px;border-radius:3px;border:1.5px solid var(--line);display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));

const roleName = r => r === "sys" ? "La plataforma (automàtic)" : (ROLES[r]?.n || r);
const zchip = z => `<span class="chip z-${z}"><span class="dot ${z}"></span>${ZONES[z].n}</span>`;
const pageHref = id => PAGES[id] ? `#p-${id}` : (VIEWS[id] ? `#${id}` : "#");
const modPages = mid => Object.keys(PAGES).filter(k => PAGES[k].m === mid);
const ZORDER = ["pub", "soc", "adm"];

/* --- Connexions entre pàgines (calculades) --- */
const OUT = {}, IN = {};
for (const [id, p] of Object.entries(PAGES)) {
  const seen = new Map();
  const add = (to, lab) => { if (to && to !== id && !seen.has(to)) seen.set(to, lab); };
  (p.mk || []).forEach(b => walkBlock(b, add));
  (p.go || []).forEach(([to, lab]) => add(to, lab));
  OUT[id] = [...seen].map(([to, lab]) => ({ to, lab }));
}
function walkBlock(b, add) {
  const t = b[0];
  if (t === "btns") b[1].forEach(([l, to]) => add(to, l));
  if (t === "cards") b[1].forEach(([l, , to]) => add(to, l));
  if (t === "hero") (b[3] || []).forEach(([l, to]) => add(to, l));
  if (t === "split") { b[1].forEach(x => walkBlock(x, add)); b[2].forEach(x => walkBlock(x, add)); }
}
for (const [id, outs] of Object.entries(OUT)) for (const o of outs) if (PAGES[o.to]) (IN[o.to] ||= []).push({ from: id, lab: o.lab });
const PROC_BY_PAGE = {};
PROCS.forEach(pr => pr.s.forEach((s, i) => { (PROC_BY_PAGE[s[2]] ||= []).push({ pr, i }); }));

/* --- Pantalles d'exemple --- */
const TONES = { ok:/^(actiu|activa|pagat|pagada|vigent|conciliat|disponible|confirmada|correcte|obert|oberta|publicat|apte|real|realitzada|tancada econòmicament|justificat|enviada|nou|propi|98 %|95 %|núm\.)/i,
  warn:/^(pendent|per renovar|llista d'espera|en revisió|esborrany|assignat|previst|revisar|llogat|completa)/i,
  bad:/^(impagat|caducada|baixa|cancel|anul|duplicat|marge baix|sense coincidència)/i };
function cell(c) {
  c = String(c);
  if (c[0] !== "!") return esc(c);
  const v = c.slice(1); const tone = TONES.ok.test(v) ? "ok" : TONES.warn.test(v) ? "warn" : TONES.bad.test(v) ? "bad" : "";
  return `<span class="pill ${tone}">${esc(v)}</span>`;
}
const mb = ([l, to, st]) => to && pageHref(to) !== "#" ? `<a class="mbtn ${st||""}" href="${pageHref(to)}" title="Porta a: ${esc(PAGES[to]?.n || to)}">${esc(l)}</a>` : `<span class="mbtn ${st||""}" title="Acció dins d'aquesta pantalla">${esc(l)}</span>`;
function qr(seed) {
  let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const n = 21; let r = "";
  const fin = (x, y) => (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on;
    if (fin(x, y)) { const cx = x > 13 ? x - 14 : x, cy = y > 13 ? y - 14 : y; on = cx === 0 || cy === 0 || cx === 6 || cy === 6 || (cx > 1 && cx < 5 && cy > 1 && cy < 5); }
    else { h = (h * 1103515245 + 12345) >>> 0; on = (h >>> 16) % 2 === 0; }
    if (on) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 21 21" aria-label="Codi QR d'exemple" role="img"><g fill="#062a47">${r}</g></svg>`;
}
function block(b) {
  const [t, a, c, d] = b;
  switch (t) {
    case "h": return `<div class="mh"><b>${esc(a)}</b>${c ? `<span>${cell(c)}</span>` : ""}</div>`;
    case "kpi": return `<div class="kpis">${a.map(([l, v, tn]) => `<div class="kpi ${tn||""}"><small>${esc(l)}</small><b>${esc(v)}</b></div>`).join("")}</div>`;
    case "filters": return `<div class="filters">${a.map(f => `<span class="f">${esc(f)} ▾</span>`).join("")}${c ? `<span class="s">${esc(c)}</span>` : ""}</div>`;
    case "table": return `<div class="tw"><table><thead><tr>${a.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${c.map(r => `<tr>${r.map(x => `<td>${cell(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "form": return `<div class="fm">${a.map(([l, v, k]) => `<label>${esc(l)}<span class="in ${k||""}">${esc(v)}</span></label>`).join("")}</div>`;
    case "check": return `<div class="ck">${esc(a)}</div>`;
    case "btns": return `<div class="mbtns">${a.map(mb).join("")}</div>`;
    case "alert": return `<div class="alert ${a}">${esc(c)}</div>`;
    case "cards": return `<div class="cards">${a.map(([ti, sub, to]) => to ? `<a class="mc" href="${pageHref(to)}"><b>${esc(ti)}</b><span>${esc(sub)}</span></a>` : `<div class="mc"><b>${esc(ti)}</b><span>${esc(sub)}</span></div>`).join("")}</div>`;
    case "tabs": return `<div class="tabs">${a.map((x, i) => `<span class="${i === (c||0) ? "on" : ""}">${esc(x)}</span>`).join("")}</div>`;
    case "steps": return `<div class="stp">${a.map((x, i) => `<span class="${i === c ? "on" : i < c ? "done" : ""}">${i + 1}. ${esc(x)}</span>`).join("")}</div>`;
    case "split": return `<div class="split"><div>${a.map(block).join("")}</div><div>${c.map(block).join("")}</div></div>`;
    case "cal": return `<div class="cal">${a.map(([w, x]) => `<div><b>${esc(w)}</b><span>${esc(x)}</span></div>`).join("")}</div>`;
    case "list": return `<div class="li">${a.map(x => { const k = x[0] === "+" ? "y" : x[0] === "-" ? "n" : ""; return `<div class="${k}">${esc(k ? x.slice(1) : x)}</div>`; }).join("")}</div>`;
    case "upload": return `<div class="up">${esc(a)}</div>`;
    case "text": return `<p style="margin:0">${esc(a)}</p>`;
    case "choice": return `<div class="choice">${a.map(([x, y], i) => `<div class="${i === c ? "on" : ""}"><b>${esc(x)}</b><span class="muted">${esc(y)}</span></div>`).join("")}</div>`;
    case "chart": { const mx = Math.max(...a.map(x => x[1])); return `<div class="chl">${a.map(([l, v]) => `<div><span>${esc(l)}</span><i style="width:${(v / mx * 100).toFixed(1)}%"></i><em>${v.toLocaleString("ca")}</em></div>`).join("")}<small class="muted">${esc(c)}</small></div>`; }
    case "hero": return `<div class="hero"><b>${esc(a)}</b><p>${esc(c)}</p><div class="mbtns">${(d||[]).map(mb).join("")}</div></div>`;
    case "carnet": return `<div class="carnet"><div><div class="ct"><img src="${LOGO}" alt="">C.R.I.S.</div><div class="nm">Marta Puig Soler</div><small>Núm. 1287 · Ple dret</small><small>Vàlid fins 31/12/2026</small><span class="badge">Sòcia des de 2019 · 7 anys</span></div>${qr("1287")}</div>`;
  }
  return "";
}

  return `<div class="frame"><div class="fbar"><i></i><i></i><i></i><span class="url">cris.barcelona${esc(p.p)}</span></div><div class="fzone ${p.z}">${ZONES[p.z].n}${p.idea ? " · idea nova" : ""}</div><div class="mock">${(p.mk || []).map(block).join("")}</div></div>`;

const POS = { m7:[40,170], m11:[40,420], m1:[300,60], m2:[300,210], m3:[300,360], m8:[300,510], m6:[560,60], m4:[560,300], m10:[560,510], m5:[820,190], m9:[820,420] };
const SHORT = { m0:"Base comuna", m1:"Socis i carnet", m2:"Cursos", m3:"Sortides i medi ambient", m4:"Material", m5:"Tresoreria i pagaments", m6:"Llicències", m7:"Web pública", m8:"Dept. d'Història", m9:"Dashboard", m10:"Botiga (futur)", m11:"Idees noves" };
const EXT = [ ["cluber","Cluber (es retira)",[820,40],["m1","m5"],"Migració única de socis, rebuts i mandats SEPA; després es dona de baixa"], ["verifactu","Facturació (Verifactu)",[1040,110],["m5"],"Servei homologat: numera cada factura, fa el registre Verifactu i retorna PDF i QR"], ["banc","Banc (Norma 43)",[1040,180],["m5"],"Extracte per a la conciliació; més endavant, open banking de només lectura. Els pagaments sortints es signen al banc"], ["stripe","Stripe",[1040,250],["m5","m1"],"Cobraments amb targeta i Bizum, i domiciliació SEPA de quotes"], ["fecdas","FECDAS",[560,-10],["m6"],"Tramitació de llicències amb el llistat exportat"], ["centre","Centre de busseig",[820,560],["m4"],"Lloguer de material i la seva factura"], ["minka","Minka · Meteocat",[40,560],["m11","m3"],"Enllaços externs: ciència ciutadana i previsió del mar"] ];
function vMapa() {
  const W = 200, H = 58;
  const edges = new Map();
  MODS.forEach(m => m.rel.forEach(([to, t]) => { if (to === "*" || !POS[m.id] || !POS[to]) return; const k = [m.id, to].sort().join("|"); if (!edges.has(k)) edges.set(k, []); edges.get(k).push(`${MOD[m.id].n} → ${MOD[to].n}: ${t}`); }));
  const c = id => { const [x, y] = POS[id]; return [x + W / 2, y + H / 2]; };
  const path = (a, b) => { const [x1, y1] = a, [x2, y2] = b; const mx = (x1 + x2) / 2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; };
  let svg = `<svg class="mapsvg" id="msvg" viewBox="0 -30 1260 720" role="img" aria-label="Mapa de connexions entre mòduls">`;
  for (const [k] of edges) { const [a, b] = k.split("|"); svg += `<path class="edge" data-a="${a}" data-b="${b}" d="${path(c(a), c(b))}"/>`; }
  EXT.forEach(([id, , [x, y], tos]) => tos.forEach(t => { svg += `<path class="edge ext" data-a="${id}" data-b="${t}" d="${path([x + 80, y + 20], c(t))}"/>`; }));
  MODS.forEach(m => { if (!POS[m.id]) return; const [x, y] = POS[m.id];
    svg += `<g class="node ${m.tag === "Must" ? "must" : ""}" data-id="${m.id}" tabindex="0" role="link" aria-label="${esc(m.n)}"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="10"/><text class="n" x="${x + 14}" y="${y + 21}">${m.num} · ${esc(m.tag)}</text><text x="${x + 14}" y="${y + 42}">${esc(SHORT[m.id])}</text></g>`; });
  EXT.forEach(([id, n, [x, y]]) => { svg += `<g class="node ext" data-id="${id}"><rect x="${x}" y="${y}" width="160" height="40" rx="20"/><text x="${x + 80}" y="${y + 25}" text-anchor="middle">${esc(n)}</text></g>`; });
  svg += `<g class="base node" data-id="m0" tabindex="0" role="link" aria-label="Base comuna"><rect x="40" y="640" width="1180" height="44" rx="10"/><text class="b" x="60" y="667">0 · Base comuna</text><text x="210" y="667">a sota de tot: usuaris i rols, registre, notificacions, integracions, RGPD, allotjament i còpies</text></g></svg>`;
  window.__EDGES = edges;
  return `<div class="crumbs"><a href="#inici">Inici</a><span class="sep">/</span><span>Mapa de connexions</span></div>
  <h1>Mapa de connexions</h1><p class="lead">Com es passen dades els mòduls entre ells. Passa per sobre d'un mòdul per ressaltar-ne les connexions; clica'l per obrir-lo.</p>
  <div class="legend"><span><i class="sw" style="background:var(--z-adm-bg)"></i>Mòdul imprescindible (Must)</span><span><i class="sw" style="background:var(--surface)"></i>Altres mòduls</span><span><i class="sw" style="border-style:dashed;background:var(--surface2)"></i>Sistema extern</span></div>
  <div class="mapwrap">${svg}</div>
  <div class="card relpanel" id="relp"><b>Toca o passa per sobre d'un mòdul</b><div class="muted">Aquí apareixeran les dades que intercanvia amb els altres.</div></div>
  <section class="sec"><h2>El recorregut de les dades</h2><div class="grid g2">
    ${[["Socis → Cursos, sortides i conferències","Identitat, tipus, estat i carnet de cada inscrit.",["m1","m2","m3","m8"]],["Cursos i sortides → Material","Inscripcions i el material que cada participant necessita.",["m2","m3","m4"]],["Cursos, sortides i material → Tresoreria","Ingressos, despeses i cost de material per calcular el marge.",["m2","m3","m4","m5"]],["Socis → Llicències","Dades de tramitació de la llicència.",["m1","m6"]],["Web pública → Socis, cursos, sortides i conferències","Formularis d'alta i d'inscripció.",["m7","m1","m2","m3","m8"]],["Cluber → Socis i tresoreria","Migració única; després Cluber es dona de baixa.",["m1","m5"]],["Stripe, banc i servei de facturació → Tresoreria","Cobraments, extracte per conciliar i factures Verifactu.",["m5"]],["Cursos i sortides → Llibre d'immersions","Immersions fetes i material utilitzat.",["m2","m3","m11"]],["Tots els mòduls → Dashboard","Dades per als indicadors de la junta.",["m9"]]].map(([t, d, ms]) => `<div class="card"><b>${esc(t)}</b><div class="muted" style="font-size:.92rem">${esc(d)}</div><div class="chips" style="margin-top:8px">${ms.map(x => `<a class="chip" href="#${x}">${MOD[x].num} · ${esc(SHORT[x])}</a>`).join("")}</div></div>`).join("")}
  </div></section>`;
}
function wireMapa() {
  const s = $("#msvg"); if (!s) return;
  const panel = $("#relp");
  const show = id => {
    s.classList.add("hl");
    s.querySelectorAll(".edge").forEach(e => e.classList.toggle("on", e.dataset.a === id || e.dataset.b === id));
    s.querySelectorAll(".node").forEach(n => n.classList.toggle("on", n.dataset.id === id));
    const ext = EXT.find(e => e[0] === id);
    if (ext) { panel.innerHTML = `<b>${esc(ext[1])}</b> <span class="muted">(sistema extern)</span><div>${esc(ext[4])}</div>`; return; }
    const m = MOD[id];
    panel.innerHTML = `<b>${m.num} · ${esc(m.n)}</b><ul class="plain" style="margin-top:6px">${m.rel.map(([to, t]) => `<li>${to === "*" ? "" : `<a href="#${to}">${esc(MOD[to].n)}</a>: `}${esc(t)}</li>`).join("")}</ul><a href="#${id}">Obrir el mòdul →</a>`;
  };
  s.querySelectorAll(".node").forEach(n => {
    n.addEventListener("mouseenter", () => show(n.dataset.id));
    n.addEventListener("focus", () => show(n.dataset.id));
    n.addEventListener("click", () => { if (MOD[n.dataset.id]) location.hash = n.dataset.id; else show(n.dataset.id); });
    n.addEventListener("keydown", e => { if (e.key === "Enter" && MOD[n.dataset.id]) location.hash = n.dataset.id; });
  });
}

/* --- Cerca --- */
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function search(q) {
  const box = $("#sres"), nav = $("#nav");
  q = norm(q.trim());
  if (!q) { box.hidden = true; nav.hidden = false; return; }
  const res = [];
  for (const [k, p] of Object.entries(PAGES)) {
    const hay = norm([p.n, p.d, p.p, ...p.f.flat()].join(" "));
    if (hay.includes(q)) res.push([norm(p.n).includes(q) ? 0 : 1, `<a href="#p-${k}"><span class="dot ${p.z}"></span> ${esc(p.n)}<small>${esc(MOD[p.m].n)} · ${ZONES[p.z].n}</small></a>`]);
  }
  for (const pr of PROCS) if (norm(pr.n + " " + pr.s.map(s => s[0]).join(" ")).includes(q)) res.push([norm(pr.n).includes(q) ? 0 : 2, `<a href="#${pr.id}">${esc(pr.n)}<small>Procés · ${pr.s.length} passos</small></a>`]);
  for (const m of MODS) if (norm(m.n + " " + m.obj).includes(q)) res.push([0, `<a href="#${m.id}">${m.num} · ${esc(m.n)}<small>Mòdul</small></a>`]);
  res.sort((a, b) => a[0] - b[0]);
  box.innerHTML = `<span class="eyebrow" style="color:var(--side-muted);padding:0 8px 6px;display:block">${res.length} resultats</span>` + (res.map(r => r[1]).join("") || `<div style="padding:8px;color:var(--side-muted)">Cap resultat. Prova amb una altra paraula.</div>`);
  box.hidden = false; nav.hidden = true;
}

/* --- Encaminament --- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "inici";
  const v = $("#view");
  let html, r = h;
  if (h.startsWith("p-") && PAGES[h.slice(2)]) html = vPagina(h.slice(2));
  else if (MOD[h]) html = vModul(h);
  else if (PROC[h]) html = vProces(h);
  else if (h === "mapa") html = vMapa();
  else if (h === "processos") html = vProcessos();
  else if (h === "rols") html = vRols();
  else if (h === "decisions") html = vDecisions();
  else { html = vInici(); r = "inici"; }
  v.innerHTML = html;
  if (h === "mapa") wireMapa();
  markNav(PROC[h] ? "processos" : r);
  $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
}
function rerenderProc(i) {
  const h = location.hash.slice(1); const pr = PROC[h]; if (!pr) return;
  STEP = Math.max(0, Math.min(pr.s.length - 1, i));
  const y = window.scrollY; $("#view").innerHTML = vProces(h); window.scrollTo(0, y);
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g && PROC[location.hash.slice(1)]) { e.preventDefault(); rerenderProc(+g.dataset.go); return; }
  const st = e.target.closest("a[data-step]");
  if (st) { STEP = +st.dataset.step; if (location.hash === st.getAttribute("href")) { e.preventDefault(); rerenderProc(STEP); } return; }
  const a = e.target.closest('a[href^="#"]');
  if (a && PROC[a.getAttribute("href").slice(1)] && !a.dataset.step) STEP = 0;
});
document.addEventListener("keydown", e => {
  if (!PROC[location.hash.slice(1)] || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") rerenderProc(STEP + 1);
  if (e.key === "ArrowLeft") rerenderProc(STEP - 1);
});
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
$("#q").addEventListener("input", e => search(e.target.value));
$("#sres").addEventListener("click", e => { if (e.target.closest("a")) { $("#q").value = ""; search(""); } });
$("#menuBtn").addEventListener("click", () => { const s = $("#side"); s.classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", s.classList.contains("open")); });
buildNav(); route();

</script>
