<title>Arbre de processos — Plataforma C.R.I.S.</title>
<style>
:root{--bg:#f4f7f8;--ink:#0b2b3c;--acc:#1e8fb0;--line:#c9d7dd}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:14px 22px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:13px;color:#b8d9e3}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:6px;min-width:240px;font-size:14px}
.bar button{padding:6px 10px;border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:6px;cursor:pointer;font-size:13px}
.bar button:hover{background:var(--acc);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 22px;background:#fff;border-bottom:1px solid var(--line)}
.legend label{font-size:12px;display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;cursor:pointer;color:#fff;user-select:none}
.legend input{margin:0}
main{padding:16px 22px 60px;max-width:1200px;margin:auto}
details{margin-left:18px;border-left:2px solid var(--line);padding-left:10px}
summary{cursor:pointer;padding:3px 4px;border-radius:5px;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--acc);display:inline-block;width:12px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
summary:hover,.leaf:hover{background:#e6f1f5}
.leaf{margin-left:18px;border-left:2px solid var(--line);padding:3px 4px 3px 22px;border-radius:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#fff;padding:1px 6px;border-radius:9px;white-space:nowrap}
.tag{font-size:11px;background:#e2eef2;color:var(--ink);padding:1px 7px;border-radius:9px}
.note{font-size:12px;color:#5a6f78;font-style:italic}
.chip{font-size:11px;color:var(--acc);border:1px solid var(--acc);padding:0 7px;border-radius:9px;cursor:pointer;background:#fff}
.chip:hover{background:var(--acc);color:#fff}
.hide{display:none!important}.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{background:#ffe9a8}100%{background:transparent}}
mark{background:#ffe27a;padding:0 1px}
.t-modul>summary,.t-modul{font-weight:700;font-size:16px}
.t-modul>summary{margin-top:8px}
.stat{margin-left:auto;font-size:12px;color:#5a6f78}
</style></head><body>

const active=new Set(Object.keys(TYPES));
const idx={},labels={};
function reg(n,p){idx[n.id]={n,p};labels[n.id]=n.label;(n.children||[]).forEach(c=>reg(c,n.id))}

const tree=document.getElementById('tree');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function head(n){
  const t=TYPES[n.type];const f=document.createDocumentFragment();
  const b=document.createElement('span');b.className='badge';b.style.background=t[1];b.textContent=t[0];f.appendChild(b);
  const l=document.createElement('span');l.className='lbl';l.innerHTML=esc(n.label);f.appendChild(l);
  if(n.tag){const g=document.createElement('span');g.className='tag';g.textContent=n.tag;f.appendChild(g)}
  if(n.note){const g=document.createElement('span');g.className='note';g.textContent='— '+n.note;f.appendChild(g)}
  (n.links||[]).forEach(id=>{const c=document.createElement('span');c.className='chip';c.textContent='→ '+(labels[id]||id).replace(/^\d+\.\s*/,'');c.onclick=e=>{e.preventDefault();e.stopPropagation();goTo(id)};f.appendChild(c)});

function build(n,depth){
  let el;
  if(n.children&&n.children.length){
    el=document.createElement('details');const s=document.createElement('summary');s.appendChild(head(n));el.appendChild(s);
    n.children.forEach(c=>el.appendChild(build(c,depth+1)));
  }else{el=document.createElement('div');el.className='leaf';el.appendChild(head(n))}

const lg=document.getElementById('legend');
Object.entries(TYPES).forEach(([k,v])=>{const l=document.createElement('label');l.style.background=v[1];l.innerHTML='<input type="checkbox" checked> '+v[0];l.firstChild.onchange=e=>{e.target.checked?active.add(k):active.delete(k);filter()};lg.appendChild(l)});

function goTo(id){
  document.getElementById('q').value='';filter();
  let e=document.getElementById(id);if(!e)return;
  let p=e.parentElement;while(p&&p!==tree){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement}

function clearMarks(){document.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)))}
function filter(){
  const q=document.getElementById('q').value.trim().toLowerCase();clearMarks();
  let shown=0,total=0;
  function vis(n){
    const el=document.getElementById(n.id);total++;
    const text=(n.label+' '+(n.note||'')+' '+(n.tag||'')).toLowerCase();
    const self=active.has(n.type)&&(!q||text.includes(q));
    let any=false;(n.children||[]).forEach(c=>{if(vis(c))any=true});
    const v=self||any;el.classList.toggle('hide',!v);

    if(q&&self){const lb=el.querySelector(':scope > summary .lbl, :scope > .lbl');if(lb){const i=n.label.toLowerCase().indexOf(q);if(i>=0)lb.innerHTML=esc(n.label.slice(0,i))+'<mark>'+esc(n.label.slice(i,i+q.length))+'</mark>'+esc(n.label.slice(i+q.length))}}
    return v}
  vis(DATA);
