{# Un camp de formulari amb l'etiqueta, l'ajuda i els errors (B8). Django enllaça l'ajuda amb aria-describedby i marca aria-invalid. #}
<div class="camp">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="ajuda" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
