# Tauler de preguntes pendents: opcions i recomanació de Claude
#
# El tauler és un apartat de la línia cronològica, protegit amb una segona contrasenya
# (tools/linia-cronologica/README.md). Mostra totes les preguntes obertes que el generador ja llegeix:
# docs/decisions/pendents.md (oberts i preguntes de les tandes), l'apèndix de preguntes de
# docs/planning.md (#preguntes) i docs/preguntes-externes.md.
#
# Aquest fitxer NO repeteix el text de les preguntes: només hi afegeix les opcions A a D i quina
# recomana Claude, escrita en el moment de fer la pregunta (mai per la IA de Make). Una pregunta
# sense entrada aquí surt al tauler només amb la resposta lliure.
#
# Clau: l'identificador tal com surt a la font (P-49, «S-M01-04», «S-M01-12, 13»...). Les preguntes
# de les tandes de pendents.md llegeixen les opcions de la columna «Opcions» i no cal posar-les aquí.
#
# Camps de cada entrada:
#   punt        (opcional) quina part concreta de la pregunta responen les opcions
#   opcions     de 2 a 4, amb les claus A, B, C i D
#   recomanada  la clau que recomana Claude
#   perque      per què, en una o dues frases
#   data        quan es va escriure la recomanació (AAAA-MM-DD)
#
# Preguntes noves que Claude fa en un fil i que no són a cap altra font: van a «noves», amb
# un identificador F-NNN que no es reutilitza, i també porten:
#   pregunta, context, responsable, tasques (llista), bloqueja (true si atura una tasca)
# Quan la resposta s'incorpora al pla o a una decisió, l'entrada de «noves» s'esborra.

opcions:
  P-07:
    opcions:
      A: No es desa res del certificat mèdic; el centre de busseig o l'instructor el comprova fora de la plataforma.
      B: Només la data fins a la qual és vàlid, sense cap document ni cap altra dada.
      C: El soci declara en inscriure's que té el certificat vigent (sí o no), sense desar cap data.
      D: Decidir-ho amb l'assessor de protecció de dades abans de triar.
    recomanada: A
    perque: >-
      La regla «cap dada de salut a la plataforma» és del CLAUDE.md, i fins i tot una data de validesa
      revela que la persona té (o no) un certificat mèdic. A és l'única opció que no obre cap
      excepció; si més endavant cal, es pot passar a C sense migrar dades.
    data: 2026-11-12

  P-11:
    opcions:
      A: El CLAUDE.md fa de constitució i no es crea cap fitxer nou.
      B: Crear docs/constitution.md amb els principis i deixar al CLAUDE.md només les instruccions per a Claude.
    recomanada: A
    perque: >-
      El CLAUDE.md ja té les regles que s'han de complir sempre; un segon fitxer duplicaria el contingut,
      cosa que el mateix CLAUDE.md prohibeix.
    data: 2026-11-12

  P-13:
    opcions:
      A: Anonimitzar les entrevistes (rols en lloc de noms, sense dades de contacte) i pujar-les a docs/context/.
      B: No pujar-les mai; només un resum anonimitzat de les conclusions.
      C: Deixar-les fora del repositori tal com estan ara.
    recomanada: B
    perque: >-
      Un resum de conclusions dona el mateix valor per al projecte i elimina el risc que una frase concreta
      permeti identificar algú. Anonimitzar un text sencer és més feina i més fàcil de fer malament.
    data: 2026-11-12

  P-14:
    opcions:
      A: Fer una versió nova del document incremental amb el context v4 i moure l'actual a docs/arxiu/.
      B: Mantenir l'actual com a vigent i afegir-hi un annex amb els canvis del context v4.
      C: No tocar-lo fins a la propera entrega de l'assignatura.
    recomanada: C
    perque: >-
      És un lliurament de l'assignatura: el moment natural de fer-ne la versió nova és la propera entrega,
      i llavors es fa com diu A (versió nova i l'antiga a l'arxiu, que mai s'esborra).
    data: 2026-11-12

  P-22:
    opcions:
      A: Claude genera un .docx nou amb els textos de substitució aplicats i el PDF corresponent.
      B: Aplicar els textos a mà al .docx actual.
      C: Deixar el .docx com a document històric i remetre al pla (docs/planning.md) per a la versió vigent.
    recomanada: C
    perque: >-
      El pla és la font única de l'especificació (decisió 047); mantenir el .docx al dia duplica feina cada
      vegada que canvia una regla. Una nota a la portada que remeti al pla evita confusions.
    data: 2026-11-12

  P-38:
    opcions:
      A: Fase futura, després del mòdul 02 (que registra l'assistència); llavors es decideixen fites i punts.
      B: Només la bitàcola (sortides i hores), sense insígnies ni punts.
      C: Bitàcola i insígnies, sense punts.
      D: Treure-ho del wireframe del compte personal fins que la junta ho demani.
    recomanada: A
    perque: >-
      Les dades de la bitàcola surten de l'assistència del mòdul 02, que encara no existeix. Decidir ara
      fites i punts seria decidir sobre dades que no tenim.
    data: 2026-11-12

  P-39:
    opcions:
      A: Corregir el nom a la propera versió del document incremental (lligat a la P-14).
      B: Fer ara una versió corregida només amb el nom.
    recomanada: A
    perque: Els fitxers de text del repositori ja estan corregits; el PDF es pot esperar a la propera versió.
    data: 2026-11-12

  P-41:
    opcions:
      A: Cap foto sense autor i permís registrats, consentiment de les persones que hi surtin i text de crèdit fix.
      B: Al principi, només fotos sense persones reconeixibles (fons marí, material, instal·lacions).
      C: Fotos amb persones només de socis que ho hagin acceptat al seu perfil.
      D: Cap foto fins que la web pública (mòdul 07) estigui a punt de sortir.
    recomanada: B
    perque: >-
      B permet tenir galeria des del primer dia sense haver de gestionar consentiments; A és la regla per a
      quan s'hi vulguin afegir fotos amb persones.
    data: 2026-11-12

  P-48:
    opcions:
      A: No; un sol tresorer i cap acció amb doble aprovació.
      B: Només com a opció futura, si la junta la demana per a devolucions a partir d'un import.
    recomanada: A
    perque: >-
      El club té un sol tresorer i la regla del projecte és no fer de la doble aprovació un requisit.
      Si la junta ho vol més endavant, es reobre amb una decisió nova.
    data: 2026-11-12

  P-49:
    punt: "(1) quines llengües vol el club i on"
    opcions:
      A: Només català a tota la plataforma, de moment (la plataforma ja queda preparada per traduir-se, 061).
      B: Català i castellà només a la web pública.
      C: Català i castellà a la web pública i als correus; l'àrea de socis i l'administració, només en català.
      D: Català, castellà i anglès a la web pública; la resta, només en català.
    recomanada: A
    perque: >-
      Cada llengua activa demana una persona que tradueixi i revisi cada canvi, també dels textos legals.
      Sense aquesta persona, la 061 ja diu que la llengua no s'activa; és millor decidir-ho quan hi sigui.
    data: 2026-11-12

  P-53:
    punt: "si la cua de la T-M01-39 és condició del nivell 1 de producció (Q-086)"
    opcions:
      A: No és condició del nivell 1; es fa quan toqui, com qualsevol altra tasca.
      B: Només és condició si la mesura darrere del proxy encara mostra una diferència apreciable (més de 5 ms de mediana).
      C: Sí, és condició del nivell 1 sigui quin sigui el resultat de la mesura.
    recomanada: B
    perque: >-
      La diferència es va mesurar en local; darrere del proxy i de la xarxa pot quedar amagada pel soroll.
      Decidir amb la mesura real evita fer una cua que potser no cal.
    data: 2026-11-12

  P-83:
    opcions:
      A: Esperar; el càrrec no es pot tornar a provar fins que l'intent acabi sol (notificació del proveïdor o xarxa de seguretat).
      B: Reprendre; mentre l'intent és en curs, «Paga ara» torna el soci a la mateixa ordre del proveïdor, sense intent ni ordre nous.
      C: Fer caducar l'intent amb targeta al cap d'un temps configurable (per exemple, 30 minuts) i deixar-ne començar un de nou.
      D: Esperar la resposta del proveïdor (P-45) sobre si una ordre es pot cancel·lar i quan caduca.
    recomanada: B
    perque: >-
      Amb la A, qui tanca la pàgina sense voler es queda sense poder pagar fins l'endemà. La B no pot
      cobrar dues vegades, perquè és la mateixa ordre, i no depèn de cap resposta del proveïdor. La C
      necessita abans la P-78 (confirmacions tardanes). Mentrestant val la A.
    data: 2026-11-13

  P-84:
    opcions:
      A: Com s'ha construït; el 05b crea el pagament de la 00 en una sola funció i no s'envia cap correu fins més endavant.
      B: Una PR petita de la 00 (després de la T-M04-02) amb el servei que crea el pagament i les dues plantilles de correu; el 05b el crida.
      C: Que l'intent de pagament del 05b substitueixi el pagament de la 00 (un sol model).
    recomanada: B
    perque: >-
      Compleix la regla dels serveis i la conciliació de la 04 (T-M04-12) en necessitarà el mateix servei.
      La C és un canvi de model de dades gran sobre peces ja fetes. Mentrestant val la A.
    data: 2026-11-13

  P-81:
    opcions:
      A: Com s'ha construït; les quotes van a «General / Quotes de socis» i les inscripcions i llicències, sense centre de cost fins que el càrrec en porti (segona meitat de la T-M04-02), que es fa abans de cobrar-ne cap de debò.
      B: Rebutjar l'ingrés d'una inscripció o d'una llicència fins que el càrrec porti centre de cost.
      C: Que qui crida el servei (pagaments, activitats o llicències) li digui el centre de cost.
    recomanada: A
    perque: >-
      A la fase 1 només es cobren quotes, i el pla ja diu on van. Un ingrés sense centre de cost és un
      estat que el model admet; B deixaria un cobrament confirmat sense apuntar, i C faria que cada
      mòdul sabés coses de la tresoreria que després caldria desfer.
    data: 2026-11-13

  P-88:
    opcions:
      A: Com s'ha construït; el trànsit que crea la instal·lació (migrate) no deixa entrada al registre, com els comptes inicials, i el que es creï des d'una pantalla, sí.
      B: Que sempre en deixi, amb el sistema com a actor, i adaptar les proves del 00 i del 01 que compten les entrades del registre.
      C: Una entrada al registre per a tots els comptes creats per la instal·lació (també «Caixa» i «Banc principal»), en una tasca del 00.
    recomanada: A
    perque: >-
      El compte ja diu quan es va crear i qui el crea és sempre la instal·lació, igual que els comptes
      inicials. La B toca proves del 00 sense guanyar cap dada; la C té sentit si la junta vol el registre
      de tota la configuració. Mentrestant val la A.
    data: 2026-11-13

  P-100:
    opcions:
      A: Com s'ha construït; només val el prefix actual i el prefix no es canvia un cop hi hagi referències emeses.
      B: Es valida el codi i el control amb qualsevol prefix ben format, i la conciliació busca la referència a la base de dades.
      C: Es guarda la llista de prefixos que s'han fet servir i es validen tots.
    recomanada: B
    perque: >-
      La referència que té el soci no caduca mai (M04-6), i la conciliació l'ha de buscar igualment a la base de dades.
      La B no depèn de cap valor de l'entorn. Es decideix amb la T-M04-11, que és qui la fa servir; mentrestant val la A.
    data: 2026-11-16

  P-101:
    opcions:
      A: Com s'ha construït; com CA-T09.3, «a revisar» només si hi ha un sol càrrec pendent del mateix import; la resta, «pendents».
      B: Com LT2, tota línia d'entrada sense referència va «a revisar».
      C: «A revisar» si hi ha almenys un càrrec pendent del mateix import, encara que n'hi hagi més d'un.
    recomanada: A
    perque: >-
      La llista «a revisar» ha de servir per al que demana una decisió; amb la B s'hi barrejarien liquidacions i
      abonaments que no són quotes. Totes les línies pendents ja surten a la conciliació, i el canvi es pot fer en
      qualsevol moment perquè l'estat es torna a calcular.
    data: 2026-11-16

  P-102:
    opcions:
      A: Com s'ha construït; de 24 a 168 hores (d'un dia a una setmana).
      B: De 24 a 72 hores (com a màxim tres reintents de la xarxa).
      C: D'1 a 168 hores, perquè la xarxa també pugui deixar a revisar el mateix dia.
      D: Decidir-ho amb el tresorer quan es vegi l'ús real; mentrestant, la A.
    recomanada: A
    perque: >-
      La xarxa de seguretat passa un cop al dia: per sota de 24 hores, un sol reintent fallat ja enviaria l'intent a revisar
      i una caiguda curta del proveïdor l'hi portaria. Una setmana és prou perquè el tresorer el vegi abans que el soci
      reclami, i el rang es pot canviar sense tocar cap intent.
    data: 2026-11-16

  P-103:
    opcions:
      A: Com s'ha construït; data d'operació, concepte amb els registres 23 i les referències, un sol compte en euros, fitxer sencer o res.
      B: Com la A, però amb la data de valor.
      C: Com la A, però acceptant diversos comptes en un fitxer (caldria triar el compte a la pantalla).
      D: Esperar la mostra del banc (P-45 punt 10); mentrestant, la A.
    recomanada: A
    perque: >-
      La data d'operació és la que veu el tresorer a la banca en línia i la que porten els pagaments del proveïdor, i per
      tant la que ajuda més a conciliar. Un sol compte per fitxer evita barrejar comptes a la conciliació (si el club en
      fa servir més d'un, la C), i un fitxer amb uns totals que no quadren és un fitxer malmès: millor tornar-lo a
      descarregar que importar-ne una part amb saldos equivocats.
    data: 2026-11-16

  P-120:
    opcions:
      A: Com s'ha construït; Fernet de `cryptography` (ja és dependència), una clau per versió, xifra la més alta.
      B: AES-256-GCM de `cryptography` amb l'identificador de la fila com a dades associades, perquè un xifrat no es pugui moure a una altra fila.
      C: Xifrar a PostgreSQL amb pgcrypto.
      D: Un gestor de claus extern de la UE (per exemple, el de Scaleway) que guardi la clau mestra.
    recomanada: A
    perque: >-
      Fernet és xifratge autenticat, ja s'usa per als secrets TOTP i no afegeix cap dependència. La C fa passar la clau
      per les consultes i els registres de la base de dades, contra la 044; la D afegeix un proveïdor i un punt de
      fallada per a un club petit. La B només protegeix contra qui ja pot escriure a la base de dades, i s'hi pot passar
      més endavant amb una rotació.
    data: 2026-11-16

  P-130:
    opcions:
      A: «casella» amb botó de ràdio, títol en negreta i descripció, dins d'un grup (com s'ha fet).
      B: Un component nou «opció amb descripció» al sistema de disseny (tokens.css i design-system.md).
      C: «segmentat» per triar i la descripció de l'opció triada a sota.
    recomanada: A
    perque: >-
      Fa la feina amb components que ja existeixen i és accessible. Si la sessió de disseny vol una peça pròpia (B), les plantilles només canvien de classe.
    data: 2026-11-16
  P-133:
    opcions:
      A: Motiu obligatori i registre, sense tornar a demanar el codi TOTP.
      B: Motiu i el codi TOTP a la mateixa petició, com aprovar un esborrat RGPD.
    recomanada: A
    perque: >-
      La revocació és a petició del soci i no mou diners; el compte d'administrador ja ha entrat amb TOTP. Si la junta la vol tractar com una acció irreversible, la B.
    data: 2026-11-16
  P-135:
    opcions:
      A: El tresorer la tanca amb un botó i confirmació; tancar-la atura els recordatoris.
      B: Es tanca sola quan el tresorer fixa la primera remesa.
      C: No es tanca mai; una campanya nova substitueix l'anterior.
    recomanada: A
    perque: >-
      És la més simple i deixa la decisió al tresorer; el camp «closed_at» ja existeix.
    data: 2026-11-16
  P-123:
    opcions:
      A: Qualsevol IBAN vàlid (format i dígits de control), com s'ha construït.
      B: Només IBAN espanyols (ES) fins que el banc confirmi la zona SEPA que admet.
      C: La llista de països SEPA que doni el banc, com a dada editable a «Ajustos».
    recomanada: C
    perque: >-
      És una llista de negoci, i la regla del projecte la vol com a dada. Mentre el banc no respongui, la signatura
      continua apagada a producció i la A no arriba a cap soci real.
    data: 2026-11-16
  P-124:
    opcions:
      A: Soci actiu o impagat, amb número (com s'ha construït).
      B: Només el soci actiu.
      C: També el soci pendent amb número (readmissió), perquè la primera quota ja vagi domiciliada.
    recomanada: A
    perque: >-
      Un soci impagat que vol domiciliar la quota és el cas que més ho necessita; el pendent encara no té número.
    data: 2026-11-16
  P-128:
    opcions:
      A: Només passa a «pagar cada vegada» si era la domiciliació o no n'hi havia cap; la targeta guardada es manté (com s'ha construït).
      B: Sempre passa a «pagar cada vegada», com diu P-M05a-C literalment.
    recomanada: A
    perque: >-
      Revocar el mandat no diu res de la targeta; canviar-la sense que el soci ho demani faria fallar un cobrament que
      el soci esperava.
    data: 2026-11-17

  P-121:
    opcions:
      A: Com s'ha construït; el·lipsi, «ES … 1234», sense cap caràcter prohibit.
      B: Asteriscs amb els grups de RN-M05a-06, «ES** **** **** **** **** 1234».
      C: Mantenir «•» i treure U+2022 de la llista de la prova dels punts volats (es perd la protecció contra «l•l»).
      D: Mantenir «•» només a les plantilles, escrit com a entitat HTML («&bull;»), i deixar la prova com està.
    recomanada: A
    perque: >-
      No toca la prova que protegeix el punt volat i amaga el mateix: el país i els quatre darrers dígits. La B és
      equivalent si es vol conservar la llargada visual dels grups; la C afebleix una prova que ja ha trobat errors.
    data: 2026-11-16

  P-122:
    opcions:
      A: Com s'ha construït; l'intent passa de «pagat» a «cancel·lat» i el rebut s'anul·la amb una nota (fila nova).
      B: Un estat nou de l'intent, «revertit», per distingir-lo d'un intent cancel·lat abans de pagar.
      C: L'intent es queda «pagat» i l'índex «un sol pagat per càrrec» exclou els intents amb el pagament anul·lat.
      D: L'intent passa «a revisar» amb el motiu i el tresorer el tanca a mà (T-M05b-16).
    recomanada: A
    perque: >-
      Fa servir un estat que ja és a la llista de M05b-6 i el rebut no es toca, com diu la 045. La C deixaria dos
      intents «pagats» per al mateix càrrec i el rebut antic semblaria vàlid; la D obligaria el tresorer a fer dues
      vegades la mateixa correcció.
    data: 2026-11-16

  P-136:
    opcions:
      A: Triar targeta o Bizum deixa la transferència «abandonada», amb avís a la pantalla (com s'ha fet).
      B: El nou mètode espera fins que la transferència arribi o torni a «pendent» (P-139).
      C: Com la A, però el soci ha de confirmar que encara no ha fet la transferència.
    recomanada: A
    perque: >-
      La B deixaria el soci sense cap altra manera de pagar durant setmanes. Un pagament doble ja el detecta la
      conciliació (LT6) i es torna; la C afegeix un pas que no evita res que la A no avisi.
    data: 2026-11-16
  P-137:
    opcions:
      A: Càrrec pagat, sense rebut, i una entrada al registre perquè el tresorer ho vegi (com s'ha fet).
      B: Esperar que la targeta o el Bizum acabin i llavors emetre el rebut de la transferència.
      C: Deixar la targeta o el Bizum «abandonats» i emetre el rebut de seguida.
    recomanada: B
    perque: >-
      El soci ha de tenir el rebut del que ha pagat. Amb la B ningú no toca un intent del proveïdor que encara pot
      arribar; la A és la base segura mentre no es construeix.
    data: 2026-11-16
  P-138:
    opcions:
      A: Les plantilles no canvien.
      B: Pas 2 «Confirmació del pagament» per a tots els mètodes, i al rebut la referència de la transferència.
      C: Pas 2 propi per a la transferència («Arriba al banc del club») i la referència al rebut.
    recomanada: C
    perque: >-
      El text ha de dir qui confirma cada pagament, i RN-M05b-19 demana la referència al rebut. És feina de la
      sessió de disseny, que és la propietària de les dues plantilles.
    data: 2026-11-16
  P-139:
    opcions:
      A: Ara no caduca res; la transferència espera fins que arriba o el soci tria un altre mètode.
      B: Tasca nova al 05b; als 30 dies (`transfer_reminder_days`), «pendent» i un recordatori amb un text de la junta.
      C: Com la B, però sense tornar a «pendent»; només el recordatori.
    recomanada: B
    perque: >-
      És el que diu P-M05b-C, pas 4. Amb la P-136, el soci no queda bloquejat mentrestant, i per això la A és una
      base segura fins que hi hagi tasca.
    data: 2026-11-16

  P-113:
    opcions:
      A: Com s'ha construït; torna a pendent, es torna a calcular i, amb la mateixa referència, es torna a proposar.
      B: Torna a pendent i no es torna a proposar mai amb els càrrecs de la conciliació desfeta.
      C: Torna a pendent i va «a revisar» amb el motiu «conciliació desfeta», sense proposta, fins que el tresorer la casi o l'exclogui.
    recomanada: C
    perque: >-
      Si el pagador va escriure la referència d'una altra persona, la proposta tornarà a ser la mateixa i el tresorer
      la tornaria a confirmar per error. La C ho deixa a la llista que el tresorer ja mira, amb el motiu, i permet
      excloure-la; és un canvi petit al recàlcul, que es pot fer en qualsevol moment perquè l'estat es torna a calcular.
    data: 2026-11-16

  P-223:
    opcions:
      A: Com s'ha construït; cap comprovació del saldo de l'origen.
      B: Es rebutja si deixa la caixa en negatiu; el banc, sense comprovació.
      C: Es rebutja si deixa qualsevol compte en negatiu.
    recomanada: A
    perque: >-
      El saldo calculat pot anar per darrere de la realitat (un extracte pendent) i la B o la C rebutjarien traspassos
      reals. Un traspàs equivocat es corregeix amb un altre en sentit contrari, i l'arqueig ensenya la diferència.
    data: 2026-11-17

  P-225:
    opcions:
      A: Com s'ha construït; l'ajust es demana amb l'arqueig, després de veure la diferència a la pantalla.
      B: Un servei a part crea l'ajust després, enllaçat a l'últim arqueig sense ajust.
    recomanada: A
    perque: >-
      L'arqueig no es modifica i porta l'ajust (M04-6). La B demanaria canviar el model o una taula d'enllaç; amb la
      A, un ajust tardà és un arqueig nou amb el seu motiu.
    data: 2026-11-17

  P-226:
    opcions:
      A: Com s'ha construït; consulta diària dels últims 7 dies a l'adaptador.
      B: Notificació del proveïdor a l'endpoint de les notificacions, amb una migració per desar-la.
      C: Fitxer de liquidacions que puja el tresorer.
    recomanada: A
    perque: >-
      Mentre no se sap com ho fa PaynoPain, la consulta no toca cap model i es recupera sola si un dia falla. Si el
      proveïdor només envia notificacions o fitxers, canvia l'adaptador i la resta continua igual.
    data: 2026-11-17

  P-229:
    opcions:
      A: Com s'ha construït; sense correu ni anotació fins que el nucli i disseny hi posin les plantilles.
      B: Un correu genèric ja, amb la plantilla d'avisos existent.
    recomanada: A
    perque: >-
      El correu i el rebut són textos per al soci i tenen propietari (nucli i disseny); la devolució ja queda a la 04,
      al càrrec i al registre.
    data: 2026-11-17

  P-251:
    opcions:
      A: Com s'ha construït; ni el soci ni el carnet canvien (com la P-110).
      B: Si era la quota vigent, el soci passa a impagat.
      C: El tresorer rep un avís per decidir-ho.
    recomanada: C
    perque: >-
      L'impagat és manual (040) i una devolució total pot ser un error del club, no del soci. La C fa que algú ho miri
      sense canviar l'estat sol; la A és l'opció per defecte fins que es decideixi.
    data: 2026-11-17

  P-194:
    opcions:
      A: Sense cap cobrament, des de la signatura; caduca el dia que es compleixen els 36 mesos (com s'ha fet).
      B: Sense cap cobrament, des de la signatura; caduca l'endemà de complir-se els 36 mesos.
      C: Un mandat que no s'ha cobrat mai no caduca fins al primer cobrament.
      D: Sense cap cobrament, des de la data de la primera remesa prevista.
    recomanada: A
    perque: >-
      Un mandat que no es fa servir mai no pot quedar actiu per sempre, i la signatura és l'única data segura.
      Caducar el mateix dia és la lectura prudent: si el banc admet aquell dia, només cal passar a la B.
    data: 2026-11-16

  P-195:
    opcions:
      A: La preferència no es toca; sense mandat actiu, la quota es paga com a RN-M05a-15 (com s'ha fet).
      B: La preferència passa a «pagar cada vegada», amb registre.
      C: S'esborra la preferència (el soci torna a «sense resposta») i entra a la campanya següent.
    recomanada: A
    perque: >-
      No canvia cap dada que el soci hagi triat i el resultat per cobrar és el mateix que la B: sense mandat actiu
      no hi ha domiciliació. En signar-ne un de nou, la preferència es torna a lligar al mandat nou (T-M05a-09 i 11).
    data: 2026-11-16

  P-197:
    opcions:
      A: No es desa res i es porta a signar el mandat; després, el soci torna a triar (com s'ha fet).
      B: Signar el mandat des d'aquest flux deixa la preferència a «domiciliació» (és respondre que sí a la P-125 només aquí).
      C: Es desa una preferència «domiciliació pendent de mandat» (cal un estat nou i una migració).
    recomanada: B
    perque: >-
      Per al soci, triar domiciliació i signar és un sol pas; tornar a triar és un pas de més. Mentre la P-125 no
      es respongui, la A no desa cap preferència sense mandat ni canvia res que el soci no hagi triat.
    data: 2026-11-16

  P-198:
    opcions:
      A: El mateix enllaç per a tothom; sense compte, porta a l'entrada i cal activar-lo per una altra via (com s'ha fet).
      B: Als socis sense compte, la invitació porta l'enllaç d'activació del compte (cal un servei d'accounts).
      C: Als socis sense compte, només l'avís en persona de la secretaria.
    recomanada: B
    perque: >-
      Amb la B el soci fa un sol clic. Cal un servei nou a `apps/accounts` que generi l'enllaç; mentre no hi
      és, la A funciona sense tocar el nucli.
    data: 2026-11-17

  P-199:
    opcions:
      A: No es convida; surt a «sense resposta» i l'atén la secretaria (com s'ha fet).
      B: Es registra com a convidat «sense correu» perquè surti apart al recompte (cal un camp o una migració).
      C: Es convida el representant o el contacte d'emergència.
    recomanada: A
    perque: >-
      No inventa cap adreça ni cap camp, i la pantalla de la campanya pot comptar els sense correu sense desar
      res més.
    data: 2026-11-17

  P-210:
    opcions:
      A: Un sol recordatori; els que tocaven es donen per enviats (com s'ha fet).
      B: Un recordatori per dia fins a posar-se al dia.
      C: Tots els que tocaven, el mateix dia.
    recomanada: A
    perque: >-
      Ningú no rep dos correus seguits pel mateix motiu, i l'últim recordatori arriba igualment.
    data: 2026-11-17

  P-211:
    opcions:
      A: Una sola campanya oberta; per obrir-ne una altra, es tanca l'anterior (com s'ha fet).
      B: Diverses obertes alhora, i cada soci rep les invitacions de cadascuna.
    recomanada: A
    perque: >-
      Evita que un soci rebi invitacions duplicades; tornar a enviar ja convida els socis nous.
    data: 2026-11-17

  P-212:
    opcions:
      A: Cal A4 per entrar; amb A5 sense A4, «no trobat» (com s'ha fet).
      B: Amb A5 sense A4 s'entra a la pantalla, però sense cap recompte.
      C: A5 implica A4 (l'editor de permisos no deixa donar A5 sense A4).
    recomanada: A
    perque: >-
      Els recomptes són dades de pagament d'A4 i la matriu inicial dona tots dos permisos als mateixos rols.
      La C és la més clara per a l'administrador, però toca l'editor de permisos del nucli.
    data: 2026-11-17

  P-241:
    opcions:
      A: La referència del pagament (transferència o proveïdor) i, si no n'hi ha, la de la liquidació (com s'ha fet).
      B: El número intern del moviment.
      C: Totes dues, en dues columnes.
      D: La columna buida fins que la gestoria digui què necessita.
    recomanada: A
    perque: >-
      És la que es troba a l'extracte del banc o a la liquidació del proveïdor, que és el que la gestoria
      ha de casar, i no porta cap dada personal.
    data: 2026-11-17

  P-242:
    opcions:
      A: Coma decimal, sense separador de milers ni símbol (1234,56), entrada i sortida separades (com s'ha fet).
      B: Amb separador de milers (1.234,56).
      C: Punt decimal (1234.56), per a programes que no siguin l'Excel en català.
    recomanada: A
    perque: >-
      L'Excel en català el llegeix com a número sense cap pas més; el separador de milers el pot convertir en text.
    data: 2026-11-17

  P-283:
    opcions:
      A: La sessió de disseny aclareix el color del text de les pestanyes en fosc fins a 4,5:1 com a mínim.
      B: Text de les pestanyes més gran o en negreta (14 px en negreta només demana 3:1).
      C: Fons de la barra més fosc en el tema fosc.
      D: S'accepta com està fins al nivell 2.
    recomanada: A
    perque: >-
      És el canvi més petit i no toca la mida ni la composició de la barra; la D deixaria el nivell 1 sense B8.
    data: 2026-11-17

  P-245:
    opcions:
      A: 8 intents en unes hores, i després la feina queda fallida i al registre (com s'ha fet).
      B: Els mateixos intents i, en acabar, un avís per correu a l'administrador.
      C: Els mateixos intents i una pantalla per tornar a enviar els esdeveniments fallits.
      D: Un ajust a «Ajustos» per triar el nombre d'intents.
    recomanada: B
    perque: >-
      Un subscriptor que falla sempre vol dir un error de programa; el registre ho guarda, però ningú no el mira
      sol. L'avís és poca feina quan hi hagi el primer subscriptor (el 02).
    data: 2026-11-17

  P-282:
    opcions:
      A: Comprovació d'arrencada. A producció, amb un proveïdor configurat, l'entorn ha de ser «live» (el nivell 1 és «live» sense autorització per cobrar).
      B: A més, la salvaguarda atura els cobraments a producció amb l'entorn de proves.
      C: Només un avís a la comprovació, sense aturar el desplegament.
      D: "Res: és responsabilitat de qui configura el desplegament."
    recomanada: A
    perque: >-
      Atura l'error abans que arribi a cap soci i no canvia res a l'entorn de proves. Si algun dia hi ha una
      preproducció amb la configuració de producció, la comprovació es pot silenciar allà a propòsit.
    data: 2026-11-17

  P-233:
    opcions:
      A: pain.008.001.02, sempre RCUR, entitats NOTPROVIDED i el nom actual, fins que el banc doni la mostra (com s'ha fet).
      B: Esperar la mostra del banc abans de generar cap fitxer.
    recomanada: A
    perque: >-
      És l'estàndard SEPA Core que accepten els bancs espanyols i no es cobra res fins al nivell 2.
    data: 2026-11-17

  P-234:
    opcions:
      A: Cap dependència ara; regles de l'esquema al codi i xmlschema amb l'XSD quan el banc doni la versió (com s'ha fet).
      B: Afegir xmlschema ara i validar contra l'XSD a cada generació.
      C: Afegir lxml ara.
    recomanada: A
    perque: >-
      La versió del banc encara no se sap i la llicència de l'XSD no és clara; el fitxer ja s'ha validat a mà sense errors.
    data: 2026-11-17

  P-280:
    opcions:
      A: Com s'ha construït. El rebut s'obre al navegador on s'ha obert l'enllaç i mentre funciona (7 dies); el correu ja porta el número, el concepte i l'import.
      B: El correu de pagament confirmat porta el rebut en PDF adjunt.
      C: Demanar un enllaç nou amb el correu també renova l'enllaç d'un càrrec pagat, només per veure'n el rebut (canvi a la 00).
      D: El convidat el demana al club, que l'hi envia a mà.
    recomanada: A
    perque: >-
      No toca la 00 ni guarda cap fitxer, i el correu ja serveix de comprovant. Si els convidats el demanen
      sovint, la C és la més petita i manté la mateixa resposta per a qualsevol adreça.
    data: 2026-11-17

  P-237:
    opcions:
      A: Un abonament per la remesa sencera; si descompta la comissió, el tresorer l'escriu i es casa el net (com s'ha fet).
      B: Un abonament per rebut.
      C: El brut a l'abonament i la comissió en una línia a part.
    recomanada: A
    perque: >-
      És el cas més habitual de les remeses SEPA; la C també hi cap amb comissió zero, i la B demana un altre flux.
    data: 2026-11-17

  P-291:
    opcions:
      A: Només AM04 es reintenta; AC04 i MD01 bloquegen el mandat; la resta, alternativa (com s'ha fet).
      B: Els codis desconeguts també es reintenten mentre quedin intents.
      C: Els codis desconeguts no proposen res i el tresorer tria.
    recomanada: A
    perque: >-
      Tornar a passar un rebut que el soci ha refusat costa una comissió i molesta; l'alternativa no fa mal i el tresorer la pot canviar.
    data: 2026-11-17

  P-292:
    opcions:
      A: Sense cap reintent possible, surt en registrar el retorn (el tresorer que el registra n'és l'autor); amb un reintent possible, quan el tresorer tria l'alternativa (com s'ha fet).
      B: Sempre quan el tresorer la confirma, també sense cap reintent possible.
      C: Sempre en registrar el retorn, sense confirmació.
    recomanada: A
    perque: >-
      Compleix CA-M05b-19 i 20 i la 048 alhora: quan no hi ha res a triar, registrar el retorn ja és la decisió del tresorer.
    data: 2026-11-17

  P-305:
    opcions:
      A: Com s'ha construït; la guia del tresorer explica que «domiciliació» amb un guió vol dir que el mandat ja no és actiu.
      B: El llistat mostra el darrer mandat amb el seu estat (caducat o bloquejat) i el recompte separa «domiciliació sense mandat actiu».
      C: En caducar o bloquejar-se el mandat, la preferència passa sola a «pagar cada vegada».
    recomanada: B
    perque: >-
      El tresorer ha de saber a qui cal demanar un mandat nou abans de la remesa; B ho mostra sense canviar la tria del soci, i C la canviaria sense que ell ho sàpiga.
    data: 2026-11-17

  P-310:
    opcions:
      A: A la fitxa del soci, «Quotes», un botó per reenviar l'alternativa d'una quota pendent o retornada; registre.
      B: Una llista pròpia a Pagaments per a la secretaria, només amb les quotes amb alternativa pendent, sense imports de tercers.
      C: Només el tresorer, fins que la junta ho torni a mirar.
    recomanada: A
    perque: >-
      La secretaria ja treballa a la fitxa del soci i hi veu les quotes; no cal obrir-li cap pantalla de pagaments amb dades d'altres socis.
    data: 2026-11-17

  P-300:
    opcions:
      A: Al nivell 2, F1-F6, E6 i B6 s'apliquen a les pàgines públiques que hi hagi llavors i al carnet; la resta, amb la 07 i el 02.
      B: El nivell 2 espera la web pública (07) i el 02 sencers, com diu ara la checklist.
      C: F1-F6 i E6 surten del nivell 2 i passen a ser condició de publicar la 07.
    recomanada: A
    perque: >-
      Deixar Cluber no ha d'esperar mòduls de la fase 2, però les pàgines públiques que ja existeixen sí que han de
      complir els punts; la C també serveix, però demana canviar la checklist.
    data: 2026-11-17

  P-330:
    opcions:
      A: No; el rol nou val a la petició següent i la sessió ja es va obrir amb TOTP.
      B: Sí, quan el rol assignat dona accés a dades personals o a diners; cal marcar quins permisos ho fan.
      C: Sí, sempre que s'assigna qualsevol rol; el compte afectat torna a entrar amb TOTP.
    recomanada: C
    perque: >-
      És la lectura més segura de RN-RP-11 i no demana classificar cada permís; l'únic cost és que el compte
      afectat torna a entrar, i assignar rols passa poques vegades.
    data: 2026-11-17

  P-337:
    opcions:
      A: No; el registre ja guarda qui l'ha casada, els càrrecs i que ha estat a mà.
      B: Sí, un motiu obligatori, com per excloure o desfer una línia.
    recomanada: B
    perque: >-
      Casar a mà salta la comprovació de la referència (RN-T18); un motiu escrit ajuda a revisar-ho
      després i costa una línia de text. A és el que hi ha fet.
    data: 2026-11-17

  P-338:
    opcions:
      A: Només la suma exacta; una transferència de més s'exclou amb motiu i el banc la retorna sencera.
      B: Es pot casar amb càrrecs que sumen menys que la línia; l'excés queda apuntat com a devolució pendent.
      C: Com B, i també casar dues línies de menys amb un mateix càrrec.
    recomanada: A
    perque: >-
      És el que demanen RN-T17 i RN-T17b i no crea saldos a favor ni pagaments parcials; LT3 i LT4 són
      casos rars que el tresorer resol amb el banc. B i C demanen canvis al model.
    data: 2026-11-17

  P-302:
    opcions:
      A: Una tasca diària cobra les quotes pendents vençudes fa com a molt 7 dies (ajust), una sola vegada per quota, sense avís previ; les més antigues es paguen des de la pantalla.
      B: Com A, amb un correu uns dies abans que avisi del cobrament i de la targeta (quatre darrers dígits).
      C: El tresorer fixa el dia del cobrament, com a la remesa.
    recomanada: B
    perque: >-
      Cobrar el dia del venciment no demana feina al tresorer; un avís previ evita sorpreses al soci i
      és el que ja es fa amb la domiciliació. A és el que hi ha fet i B s'hi afegeix sense canviar res.
    data: 2026-11-17

  P-303:
    opcions:
      A: L'intent es tanca de seguida, l'adreça del banc no es desa ni s'envia, i el soci rep l'alternativa de pagament.
      B: L'intent espera l'autenticació i el soci rep l'enllaç del banc per completar-la.
      C: No es fa cap cobrament amb la targeta guardada si el proveïdor pot demanar autenticació.
    recomanada: A
    perque: >-
      Ningú no pot autenticar l'ordre fora de sessió, així que no pot cobrar: cap doble cobrament, cap intent
      encallat i cap enllaç del banc en correus. La B fa esperar el soci i depèn que el proveïdor la tanqui.
    data: 2026-11-17

  P-309:
    opcions:
      A: Sí, si té targeta i preferència «targeta guardada»; es cobra com qualsevol altra quota.
      B: No; la primera quota es paga sempre des de la pantalla, i la targeta guardada només per a les renovacions.
    recomanada: B
    perque: >-
      La quota que activa el soci (també el readmès) és la que obre el carnet: millor que la pagui ell, a la
      pantalla, que no pas un cobrament automàtic d'una preferència que potser ja no vol. El tresorer en rep un
      sol avís.
    data: 2026-11-17

  P-331:
    opcions:
      A: Només el Tresorer, com la conciliació (T4), que també dona càrrecs per pagats; l'administrador el pot donar a un altre rol des de l'editor.
      B: El Tresorer i l'Administrador, els dos rols que avui veuen i editen la tresoreria (lectura literal de la Q-037).
      C: El Tresorer i la Junta.
    recomanada: A
    perque: >-
      Un pagament a mà dona un càrrec per pagat sense cap prova del banc ni del proveïdor: com menys
      comptes ho puguin fer, millor. Si cal, s'amplia des de l'editor sense tocar el codi.
    data: 2026-11-17

  P-332:
    opcions:
      A: Un sol mètode «manual»; el compte on entra (caixa o banc) diu si era efectiu o un ingrés al banc.
      B: Dos mètodes, «efectiu» i «presencial» (per exemple, un TPV del club), cadascun amb el seu compte.
    recomanada: A
    perque: >-
      La caixa o el banc ja diuen on són els diners i el saldo quadra igual; un segon mètode només cal si
      el club cobra presencialment d'alguna altra manera (TPV), que avui no consta.
    data: 2026-11-17

  P-333:
    opcions:
      A: "Com la 045 per a les transferències, amb M14 i motiu: el càrrec torna a pendent, el pagament queda anul·lat, l'ingrés té el seu contramoviment i el rebut queda anul·lat, tot o res."
      B: "Només com una devolució feta pel club: el càrrec passa a anul·lat i surt una sortida del mateix compte; el soci no torna a deure res."
      C: No es corregeix a la plataforma; el Tresorer ho resol amb un altre moviment i una nota.
    recomanada: A
    perque: >-
      Un error de registre no és una devolució: el soci continua devent la quota. La 045 ja resol el mateix cas
      per a les transferències i es pot reutilitzar sense cap regla nova de diners.
    data: 2026-11-17
  P-334:
    opcions:
      A: La quota no es toca; queda al registre i el pas s'aplica a la renovació següent.
      B: El tipus canvia igualment el dia de la renovació, sense retornar la diferència.
      C: El tipus canvia el dia de la renovació i es retorna la diferència amb una devolució (05b).
    recomanada: B
    perque: >-
      El pas no queda encallat un any i fa el que el correu d'avís ha promès (passar a simpatitzant en
      aquesta renovació); el tresorer rep un correu i decideix a mà. C depèn de la 05b.
    data: 2026-11-18
  P-367:
    opcions:
      A: Només s'avisa en revocar; el canvi d'IBAN no avisa.
      B: El canvi d'IBAN també avisa el tresorer, amb el mateix correu.
    recomanada: A
    perque: >-
      La regla parla de la revocació, i el rebut contra el compte antic normalment es cobra; si el
      compte és tancat, el retorn ja arriba pel circuit dels rebuts retornats.
    data: 2026-11-18
  P-368:
    opcions:
      A: El correu al soci no canvia.
      B: Quan hi ha un rebut al banc, el correu al soci afegeix que aquest rebut encara es pot cobrar i que, si es cobra, se li tornarà o se li explicarà què fer.
    recomanada: B
    perque: >-
      Avui el correu diu que el mandat no es farà servir més, i el rebut ja enviat es pot cobrar;
      el text el valida la junta, i per això no s'ha canviat.
    data: 2026-11-18

  P-364:
    opcions:
      A: Import exacte del net, del dia de l'abonament als 5 dies següents; si n'hi ha més d'una, decideix l'identificador al concepte; si no, «a revisar».
      B: El mateix, amb una finestra més ampla (per exemple, 10 dies) per als caps de setmana i els festius.
      C: Sense finestra de dates, només l'import exacte i l'identificador al concepte.
    recomanada: A
    perque: >-
      Cinc dies cobreixen un cap de setmana llarg i, amb l'import exacte, fan poc probable una proposta
      equivocada; el tresorer sempre la revisa abans de confirmar-la. Es canvia amb una constant quan el
      proveïdor digui els seus terminis (P-45).
    data: 2026-11-18

  P-365:
    opcions:
      A: La liquidació torna a «rebuda» i es compensa el traspàs del net; les comissions es queden.
      B: També es compensen les comissions, i en tornar-la a confirmar s'apunten de nou.
      C: No es pot desfer; el tresorer ho corregeix amb un traspàs en sentit contrari.
    recomanada: A
    perque: >-
      La comissió és del cobrament, no de la línia del banc: si el tresorer s'ha equivocat de línia, la
      comissió continua sent certa. Si no ho és, ja es pot anul·lar a part amb el motiu.
    data: 2026-11-18

  P-366:
    opcions:
      A: Es manté el botó de «Liquidacions»; la línia que arriba després s'exclou amb el motiu.
      B: Es treu el botó de «Liquidacions», i una liquidació del proveïdor només es confirma des de la conciliació, amb la seva línia.
      C: Es manté el botó i la conciliació permet casar la línia amb una liquidació ja confirmada, sense moure diners.
    recomanada: B
    perque: >-
      Amb la proposta de la línia, confirmar-la sense línia deixa el banc sense casar i el traspàs sense
      prova; B és el que diu CA-T11.1 i treu codi. Mentre no es respongui, A no trenca res.
    data: 2026-11-18

  P-370:
    opcions:
      A: "Els comptes actius amb el rol administrador i, si el desactiva un altre, el compte afectat; el President, no."
      B: Els mateixos que A i també els comptes amb el rol President, com als canvis de rols (RN-RP-09).
      C: Només els altres administradors, també quan el desactiva un altre.
    recomanada: A
    perque: >-
      És el que diu RN-RP-20 per als administradors, i qui perd l'accés ho sap encara que no hagi
      estat ell; B afegeix el President a una acció que només gestiona l'administrador.
    data: 2026-11-18

  P-360:
    opcions:
      A: S'accepta qualsevol llista dins del rang; si el primer recordatori és més d'un mes abans, l'avís de renovació no surt.
      B: Els ajustos rebutgen una llista amb el primer recordatori més dies abans que l'avís de renovació (28 dies per mes).
      C: Els mesos de l'avís també passen als ajustos (T-M01-43c) i l'avís surt sempre com a mínim el dia del primer recordatori.
    recomanada: B
    perque: >-
      Manté la garantia de la T-M01-43 (l'avís abans de la quota) amb una sola regla nova al desar, sense
      canviar quan surt l'avís. A deixa un forat silenciós; C canvia la regla de la 085 (T-6).
    data: 2026-11-18
  P-363:
    opcions:
      A: El llindar d'anys de VC-04 (055), que comença a 0 (cap insígnia), i mai amb una data d'alta aproximada.
      B: Sense llindar automàtic; l'administració assigna la insígnia a mà a cada soci (072, Q-066), amb una tasca nova.
    recomanada: A
    perque: >-
      A ja és construït i, amb el valor inicial 0, no dona cap insígnia: la junta pot triar més endavant
      sense cap canvi de codi. B demana un camp nou i una pantalla, i és la regla de la 072 que la 055 no va citar.
    data: 2026-11-18
  P-361:
    opcions:
      A: Un ajust de diners per tipus a la peça comuna (com s'ha construït); el camp del tipus és el preu inicial.
      B: Un model propi de versions del preu lligat al tipus, amb la seva pantalla.
    recomanada: A
    perque: >-
      Reutilitza la pantalla, l'historial, la data d'entrada en vigor, la nota i el correu al tresorer i a
      la junta de la 055 sense cap mecanisme nou; B duplica tot això per a dos valors.
    data: 2026-11-18

  P-373:
    opcions:
      A: "El tipus actiu més antic amb l'atribut que l'edat del soci permet (com s'ha construït): crear un tipus nou no canvia on va cap canvi de tipus."
      B: "Cada tipus diu a quin tipus es canvia (un camp «canvia a» a la pantalla de tipus)."
      C: "El soci tria el tipus de destinació entre els actius amb l'atribut, i el preu del suplement surt del que triï."
    recomanada: A
    perque: >-
      Manté exactament el comportament d'avui sense cap camp ni pas nou; B i C només calen si el club
      crea un segon tipus de ple dret o de simpatitzant, i es poden afegir llavors.
    data: 2026-11-18

  P-381:
    opcions:
      A: "El text editat és en català i s'envia així a tothom fins a la P-49 (com s'ha construït)."
      B: "Una versió del text per llengua activa; sense la traducció, el text per defecte traduït."
    recomanada: A
    perque: >-
      Només hi ha el català actiu (061) i B demana decidir abans quines llengües i qui les tradueix (P-49).
    data: 2026-11-18

  P-382:
    opcions:
      A: "Nota opcional, com als ajustos que no són de diners (com s'ha construït)."
      B: "Nota obligatòria en publicar qualsevol text."
    recomanada: A
    perque: >-
      L'historial ja guarda qui, quan, el text anterior i el nou; B és un canvi d'una línia si la junta ho vol.
    data: 2026-11-18

  P-377:
    opcions:
      A: "B6 amb edició (Tresorer i Administrador), com s'ha construït; sense, «no trobat»."
      B: Només el Tresorer, amb un permís propi de tancar «a revisar» al catàleg.
      C: B6 amb edició, però l'Administrador comença sense la cel·la d'edició.
    recomanada: A
    perque: >-
      Tancar no mou diners: només deixa la nota de la revisió, i qui veu la llista és qui la treballa.
      B afegeix un permís i una migració per a una acció sense efecte econòmic; es pot fer després
      si la junta vol separar-ho.
    data: 2026-11-18

  P-378:
    opcions:
      A: Les notificacions sense intent no es tanquen i es queden a la llista (com s'ha construït).
      B: Tancar-les amb una nota com els intents, amb una taula de tancaments pròpia.
      C: Que surtin soles de la llista passats uns dies, i es vegin només al registre.
    recomanada: B
    perque: >-
      Fa servir el mateix patró que els intents (nota, registre, «Tancats») i deixa la llista oberta
      buida quan tot està revisat. C amaga casos sense que ningú els hagi mirat. Mentrestant val la A.
    data: 2026-11-18

  P-374:
    opcions:
      A: "No: un tipus amb socis pendents, actius o impagats no es desactiva (com s'ha construït)."
      B: "Sí: es desactiva i els seus socis el conserven fins a la baixa; ningú no s'hi pot donar d'alta."
      C: "Sí, però abans la secretaria ha de passar els socis a un altre tipus."
    recomanada: A
    perque: >-
      És el camí sense efectes sobre socis que ja paguen; B i C demanen regles noves per a la
      renovació i els canvis de tipus d'aquests socis.
    data: 2026-11-18

  P-375:
    opcions:
      A: "No: d'un tipus amb socis només es canvia el nom (com s'ha construït)."
      B: "Sí, amb un avís dels socis afectats i un motiu, i s'aplica a la renovació següent."
    recomanada: A
    perque: >-
      Evita canviar les regles d'un soci a mig període; si cal un tipus diferent, se'n crea un de
      nou. B demana un mecanisme de canvis programats que ara no existeix.
    data: 2026-11-18

  P-376:
    opcions:
      A: "Tresorer i administrador, amb un permís propi (com s'ha construït); la Secretaria els veu."
      B: "Només l'administrador, per decisió de la junta."
      C: "Tresorer, administrador i Secretaria."
    recomanada: A
    perque: >-
      Un tipus porta un preu i regles de quota, i qui canvia el preu (VC-01) ja són el Tresorer i
      l'administrador; és editable a la matriu sense cap canvi de codi.
    data: 2026-11-18

  P-383:
    opcions:
      A: "Editables els correus sense enllaç d'entrada ni dades obligatòries (com s'ha construït); la resta, al codi."
      B: "Com A i, a més, els de pagaments, amb les variables obligatòries (l'enllaç, l'import, la referència) que el text no pot treure."
      C: "Tots, també els de compte i seguretat."
    recomanada: A
    perque: >-
      Un text editat que treu l'enllaç o una dada que el banc exigeix deixa la persona sense poder pagar o
      el club sense complir; B és possible però demana una regla nova per variable.
    data: 2026-11-18

  P-384:
    opcions:
      A: "Només l'administrador (M12, com diu la 059 i s'ha construït)."
      B: "També la Secretaria."
      C: "També la junta (President)."
    recomanada: A
    perque: >-
      És la configuració inicial de la 059 i es canvia a l'editor de permisos sense codi; un text legal
      el redacta la junta però el publica una sola persona amb doble factor.
    data: 2026-11-18

  P-385:
    opcions:
      A: "Vigent des que es publica (com s'ha construït)."
      B: "Amb una data d'entrada en vigor que es pot programar."
    recomanada: A
    perque: >-
      El model ja ho fa així i cap regla no demana programar-ne; B demana canviar com es tria la versió
      vigent a l'alta, al perfil i al mandat.
    data: 2026-11-18

  P-386:
    opcions:
      A: "El Tresorer, com els codis de retorn del banc (com s'ha construït)."
      B: "L'Administrador."
      C: "El Tresorer i l'Administrador."
    recomanada: A
    perque: >-
      És el tresorer qui parla amb el banc i ja edita els altres valors de les domiciliacions (VC-16 i
      P-291); es pot canviar a l'editor de permisos sense codi nou.
    data: 2026-11-18

  P-391:
    opcions:
      A: "«No trobat» (404), com tots els apartats d'ajustos (RN-RP-22); com s'ha construït."
      B: "«Accés denegat» (403) només per a les àrees de textos, com a excepció escrita a RN-RP-22."
      C: "«Accés denegat» (403) per a tots els apartats d'ajustos, canviant RN-RP-22."
    recomanada: A
    perque: >-
      La regla general dels apartats d'ajustos ja és «no trobat» i no revela si l'àrea existeix; B i C
      demanen canviar el pla i una pantalla diferent per a un sol tipus d'apartat.
    data: 2026-11-18

  P-392:
    opcions:
      A: "«A revisar» i el tresorer decideix: la confirmació tardana no paga el càrrec si un altre intent encara el pot cobrar (en curs, al banc o «a revisar»)."
      B: "Es paga igualment (RN-M05b-03 tal com era) i, si l'altre intent també cobra, se'n fa la devolució."
    recomanada: A
    perque: >-
      Amb B, una targeta caducada que es confirma tard i la quota ja enviada al banc es cobren totes
      dues. Resposta del propietari (18/11/2026): A.
    data: 2026-11-18

  P-399:
    punt: "Qui edita el nombre de mesos de l'avís de renovació i el rang (mínim 1 mes, CA-M01-70)."
    opcions:
      A: "El Tresorer, d'1 a 6 mesos (els recordatoris amb què es comprova ja són seus)."
      B: "La Secretaria, d'1 a 6 mesos (l'avís és una comunicació als socis)."
      C: "El Tresorer i la Secretaria, d'1 a 12 mesos."
    recomanada: A
    perque: >-
      En desar-lo es comprova contra els dies dels recordatoris (P-360), que edita el tresorer; un avís
      amb més de 6 mesos d'antelació ja no fa de recordatori. Qui l'edita es pot canviar a l'editor de
      permisos sense codi nou.
    data: 2026-11-19

  P-394:
    opcions:
      A: "Moviments del banc no anul·lats, de cap liquidació i no casats, del mateix sentit i suma exacta; desfer-ho torna la línia a «pendent» i no toca els moviments."
      B: "Només la pota d'entrada al banc d'un traspàs (CA-T07.2), i res més."
      C: "Com A, però desfer-ho també anul·la els moviments casats amb el mateix motiu."
    recomanada: A
    perque: >-
      Els moviments existeixen per si sols (una despesa, un traspàs): casar-los només diu que el banc
      els ha fet. Desfer el casament no els fa falsos; si un ho és, es corregeix pel seu camí.
    data: 2026-11-19

  P-395:
    opcions:
      A: "A mà, qualsevol liquidació rebuda amb el net exacte, fora de la finestra o ja desfeta amb la línia, si no és a la proposta d'una altra."
      B: "A mà, només les liquidacions dins la finestra de P-364."
    recomanada: A
    perque: >-
      La finestra serveix per proposar sense equivocar-se; a mà el tresorer ja veu la liquidació i
      el pas de revisió amb el brut, les comissions i el net abans de confirmar.
    data: 2026-11-19

  P-396:
    opcions:
      A: "Com s'ha construït: total + recàrrec en tres (cèntims de més al primer); només si la quota té el mateix import que l'ajust; mensuals des de la quota o des del dia que es trien; actiu amb el primer pagat; sense pas a simpatitzant mentre n'hi ha per pagar."
      B: "Igual, però els terminis sumen sempre l'ajust, encara que la quota anual sigui d'un altre import."
      C: "Igual, però amb els venciments repartits dins dels 12 mesos (0, 4 i 8 mesos; 072, Q-020)."
      D: "Igual, però a més la secretaria pot triar els terminis per al soci en una alta presencial."
    recomanada: A
    perque: >-
      La J-9 (085) és posterior a la Q-020 (072) i diu «tres terminis mensuals». Lligar-ho a l'import de
      la quota evita que triar terminis canviï el que deu el soci sense que ho decideixi la junta; amb el
      recàrrec a part, la junta pot posar 90 € + 6 €. Tot és reversible mentre la funció és apagada.
  P-397:
    opcions:
      A: "S'importa sense la data: sense carnet ni renovació automàtica; la secretaria o el tresorer ho fan a mà (com s'ha construït)."
      B: "Queda pendent i s'ha d'excloure, com una fila sense document; la secretaria en fa l'alta a mà."
      C: "Es desa la data igualment (cal treure la restricció de la base de dades) i té carnet i renovació com els altres."
    recomanada: A
    perque: >-
      És el que ja fa el codi i no canvia cap restricció; a la mostra totes les files tenen
      «idInterno». Si el tresorer diu que a l'exportació real en falten, C és la que deixa el soci al
      corrent sense feina a mà.
    data: 2026-11-19

  P-398:
    opcions:
      A: "Cap carnet si ja ha caducat; el té quan paga, pel flux normal (com s'ha construït)."
      B: "S'emet igualment i surt caducat fins que paga."
    recomanada: A
    perque: >-
      Un carnet emès ja caducat no serveix de res i deixa una entrada «carnet emès» enganyosa; amb A,
      el carnet surt quan el soci torna a estar al corrent, com qualsevol altre soci.
    data: 2026-11-19

  P-550:
    opcions:
      A: "Com s'ha construït: el tresorer puja a mà la còpia emmascarada de cada document (tots queden «not_detected»)."
      B: "Afegir una biblioteca de PDF (sense imatges): emmascarar sol l'IBAN dels PDF amb text; les fotos, a mà."
      C: "B i, a més, reconeixement de text per a les fotos (una dependència més gran, que s'executa al servidor de la UE)."
      D: "No fer cap còpia: el paquet porta sempre els originals i la junta ho accepta."
    recomanada: A
    perque: >-
      Compleix la 051 sense cap dependència nova i el tresorer ja revisa cada document; si el volum ho
      demana, B és el pas següent més petit, amb una PR risc:alt i el sí del propietari.
    data: 2026-11-24

  P-400:
    opcions:
      A: "Com s'ha construït: el rebut retornat el proposa el mateix dia; el pendent, als dies de l'ajust; un sol ajust de dies per a la quota i els terminis."
      B: "Igual, però el rebut retornat també espera els dies de l'ajust."
      C: "Igual, però amb un ajust de dies propi per a la quota anual (clau i permís nous)."
    recomanada: A
    perque: >-
      La J-4 posa el rebut retornat com a alternativa als 30 dies, i la 097 (P-61, punt 2) diu que els
      dies dels terminis són «com la quota». Només és una proposta: el tresorer marca l'impagat a mà, amb
      motiu, i el carnet continua vàlid fins llavors.
    data: 2026-11-19
  P-551:
    opcions:
      A: "Com s'ha construït: sense reduir; es treuen les metadades dels JPEG i dels PNG, i el límit és el de validate_upload (10 MB)."
      B: "Afegir Pillow (dependència nova, risc:alt): reduir el costat llarg i tornar a desar la imatge sense cap metadada."
      C: "A, i a més un límit de mida més petit només per a les fotos (un ajust)."
      D: "Acceptar només PDF i JPEG fets des de la pantalla, que redueix la imatge al navegador abans d'enviar-la."
    recomanada: A
    perque: >-
      Mentre VC-56 és apagat no es desa cap foto; A compleix el que importa per a la privacitat
      (sense GPS ni metadades) sense cap dependència, i B es pot afegir després sense tocar les dades.
    data: 2026-11-24

  P-403:
    opcions:
      A: "Com s'ha construït: desactivar-la només deixa d'oferir-la; les quotes amb una targeta ja guardada es continuen cobrant."
      B: "Desactivar-la també atura el cobrament automàtic: les quotes d'aquests socis passen a «pagar cada vegada» amb l'enllaç de pagament."
    recomanada: A
    perque: >-
      L'interruptor serveix per deixar d'oferir un mètode; el soci que ja l'ha triat no ha de quedar
      sense pagar la quota sense saber-ho. Si el proveïdor deixa de cobrar, el cobrament falla i el soci
      rep l'alternativa de pagament (T-M05b-15b), com ara.
    data: 2026-11-19
  P-418:
    opcions:
      A: "Qui té M11 prepara l'exportació i la descarrega per lliurar-la en persona al representant (amb el registre de qui i quan)."
      B: "La plataforma l'envia per correu a l'adreça del representant que consta a l'alta."
      C: "Es lliura fora de la plataforma (com ara): la plataforma només registra la petició."
    recomanada: C
    perque: >-
      Lliurar dades d'un menor no es pot desfer; fins que l'assessor ho confirmi, el camí més segur és no
      treure-les de la plataforma per cap canal nou. A o B es poden construir després sense migració.
    data: 2026-11-20
  P-416:
    opcions:
      A: "Com s'ha construït: les notes de la llista, M11 les revisa i en pot deixar fora amb motiu, contrasenya i codi; apagat fins que es digui."
      B: "A, però sense poder-ne deixar fora cap: la revisió només és mirar-les abans de lliurar-les."
      C: "A, i que la persona ho pugui demanar des de «Les meves dades» (una sol·licitud que l'administració veu a «Sol·licituds RGPD»)."
    recomanada: A
    perque: >-
      Deixar fora una nota amb motiu protegeix les dades d'altres persones, que és el que justifica la
      revisió; i com que lliurar-les no es pot desfer, que ho decideixi el propietari abans d'encendre-ho.
    data: 2026-11-20
  P-406:
    opcions:
      A: "Com s'ha construït: el tresorer rep un correu per quota (motiu i si s'ha avisat el soci), però la quota no va «a revisar»."
      B: "Com els arreus: ni correu ni «a revisar»; només el registre d'activitat."
      C: "Com els altres motius: correu i, a més, la quota «a revisar»."
    recomanada: A
    perque: >-
      El soci ja rep l'enllaç per pagar i no hi ha res a resoldre, però el correu diu al tresorer qui no
      té adreça i s'ha d'avisar d'una altra manera; sense ell, aquesta quota quedaria oblidada.
    data: 2026-11-19
  P-474:
    opcions:
      A: "Abans de migrar, qui administra la base de dades executa `CREATE EXTENSION btree_gist;` a la base de producció; la migració ja no ha de fer res."
      B: "Donar a l'usuari de l'aplicació el permís de crear extensions i deixar que ho faci la migració."
      C: "Treure la restricció de la base de dades i comprovar el solapament només al servei, amb la fila de la peça bloquejada."
    recomanada: A
    perque: >-
      L'usuari de l'aplicació no necessita permisos d'administrador de la base de dades per a res més;
      activar-la una sola vegada a mà és segur i manté la garantia a la base de dades (RN-M03-02),
      que C perdria si mai hi ha un altre camí d'escriptura.
    data: 2026-11-21
  P-405:
    opcions:
      A: "Com s'ha construït: només qui pot registrar pagaments a mà (M14; d'inici, el Tresorer)."
      B: "També la junta, com els documents de justificació dels ajuts (051)."
      C: "A més, el soci el veu a «Pagaments», al costat del rebut."
    recomanada: A
    perque: >-
      El comprovant pot dur dades de qui paga i és un document de tresoreria: com menys gent l'obri,
      millor. Si la junta l'ha de veure per a una revisió, es pot donar el permís des de l'editor.
    data: 2026-11-19
  P-458:
    opcions:
      A: "La proposta: «Declaro que soc major d'edat (tinc 18 anys o més). De moment el club no admet inscripcions de menors d'edat a les activitats.»"
      B: "Una versió més curta: «Soc major d'edat.»"
      C: "La proposta, i a més que el convidat escrigui l'any de naixement (sense la data sencera)."
      D: "Cap casella: es demana sempre la data de naixement als convidats."
    recomanada: A
    perque: >-
      Explica per què es demana i què passa si no es marca, sense demanar cap data de naixement
      (minimització); C i D recullen més dades personals del que cal mentre el club no admeti menors.
    data: 2026-11-21
  P-500:
    opcions:
      A: "El criteri vol dir «la llicència canvia dues vegades després de la versió 1» (per exemple, pagada i cancel·lada): l'esdeveniment i la font del 01 porten la mateixa versió."
      B: "Renovar també puja la versió de la llicència anterior (es desa l'enllaç amb la nova), i el criteri es prova tal com està escrit."
      C: "Es corregeix el text del criteri amb una decisió numerada, sense canviar el codi."
    recomanada: A
    perque: >-
      És el que assegura la 054 (el 01 compara versions de la mateixa llicència) i el que ja fa el codi; B
      faria pujar la versió d'una llicència que no ha canviat, i C es pot fer quan es desfaci la congelació.
    data: 2026-11-23

  P-501:
    opcions:
      A: "Només el nombre de llicències per data i categoria, i on és el llistat; cap nom ni enllaç a l'administració."
      B: "Els noms dels titulars per data i categoria, sense enllaç a l'administració."
      C: "Els noms i l'enllaç al llistat filtrat, com diu RN-M06-12."
    recomanada: A
    perque: >-
      La secretaria ja té els noms al llistat, amb la sessió i el doble factor; un correu amb noms o amb la ruta de
      l'administració pot acabar en una bústia que no és del club.
    data: 2026-11-23
  P-502:
    opcions:
      A: "Amb compte personal, «La meva llicència»; sense, la pàgina pública de llicències."
      B: "Sempre «La meva llicència»; qui no té compte el crea en entrar."
      C: "Sense compte, cap enllaç: només la data i que pot respondre el correu."
    recomanada: A
    perque: >-
      Cada persona arriba on pot renovar-la sense passos de més; B obliga un convidat a fer-se un compte i C el deixa
      sense saber com fer-ho.
    data: 2026-11-23

  P-43:
    punt: "qui edita i publica cada tipus de contingut de la web (permisos WP1 a WP6 del 07)"
    opcions:
      A: "Només l'administrador i el President (la matriu inicial de M07-4)."
      B: "El Responsable de comunicació (una persona que nomeni la junta) edita i publica tot el contingut de la web, l'ajuda i el butlletí; l'administrador i el President també."
      C: "Cada responsable la seva part: RCS els textos de cursos i sortides, el Departament d'Història la Història, la secretaria l'ajuda, i el Responsable de comunicació la resta."
      D: "El Responsable de comunicació escriu i el President aprova abans de publicar."
    recomanada: B
    perque: >-
      Una sola persona responsable evita que la web quedi antiga perquè ningú se'n sent responsable; és una cel·la de la
      matriu, i si més endavant es vol repartir (C) només cal canviar permisos des de l'app.
    data: 2026-11-21
  P-486:
    opcions:
      A: "Tots els motius a la Secretaria; els missatges tancats s'esborren 6 mesos després."
      B: "Tots a la Secretaria; s'esborren 12 mesos després de tancar-los (una temporada sencera)."
      C: "Cada motiu al seu responsable (cursos i sortides a RCS, quotes al tresorer, llicències a la secretaria); 6 mesos."
      D: "El termini que digui la gestoria, i els destinataris que decideixi la junta."
    recomanada: A
    perque: >-
      És el termini més curt que encara deixa respondre i fer seguiment; tots dos valors són ajustos i una llista que
      l'administrador pot canviar sense tocar codi quan la junta reparteixi els motius.
    data: 2026-11-21
  P-590:
    opcions:
      A: "Quatre plantilles (Bàsica i les tres de l'editor) i vuit pàgines inicials de text; Inici és la portada i Notícies, Fer-se soci, Contacte, Preguntes freqüents, Tutorials i Butlletí tenen pantalla pròpia."
      B: "Només les tres plantilles de l'editor (Portada, Activitats i Notícies), i les pàgines de text fan servir «Portada»."
      C: "Totes les pàgines de F §8.2 com a pàgines de blocs, també les que tenen pantalla pròpia."
      D: "Cap pàgina inicial: les crea qui edita la web quan tingui el contingut (P-40)."
    recomanada: A
    perque: >-
      Una pàgina de text no és una portada, i duplicar com a pàgina de blocs les que ja tenen pantalla pròpia
      faria dues adreces per a la mateixa cosa; tot és reversible (pàgines sense contingut ni publicar).
    data: 2026-11-24
  P-592:
    opcions:
      A: "De qui l'ha demanada amb MG9 (el registre de la factura manual); només ho canvia una decisió nova."
      B: "Una persona fixa del club (per exemple, la del tresorer vigent), que es tria als ajustos."
      C: "Permetre fitxers sense propietari a la 00 (torn del nucli) i obrir-los només amb MG9."
    recomanada: C
    perque: >-
      Una factura a una empresa no és de cap persona i C ho diu tal com és; mentre no hi hagi el torn del nucli,
      A no dona accés a ningú que no el tingués (qui la demana ja té MG9) i és el valor per defecte.
    data: 2026-11-24

noves:
  P-412:
    opcions:
      A: "Com és: un termini legal al codi (6 anys, variable d'entorn), que només canvia amb una decisió; es corregeix el docstring."
      B: "Un ajust editable des de l'app (amb nota i avís), dins d'un rang que digui la gestoria."
    recomanada: A
    perque: >-
      És un termini legal (085, G-1), com la caducitat dels mandats (VC-13), i un canvi des de l'app podria anonimitzar
      registres econòmics abans d'hora, que és irreversible.
    data: 2026-11-20
  P-420:
    opcions:
      A: "Com és ara: les referències del proveïdor i de la transferència es queden en clar; només el nom i el document es bloquegen."
      B: "Es bloquegen (xifrades) amb el nom i el document, i només es consulten amb M13 i un motiu; la conciliació d'aquests pagaments passa a ser manual."
      C: "Es queden en clar fins al final del termini legal i aleshores s'esborren amb la resta de dades bloquejades."
    recomanada: A
    perque: >-
      Soles no identifiquen ningú i la conciliació, els retorns i les consultes al proveïdor les necessiten; bloquejar-les
      trencaria aquests processos sense protegir gaire més, perquè el proveïdor i el banc ja guarden el lligam.
    data: 2026-11-20
  P-444:
    opcions:
      A: "CSV provisional: cognoms, nom, data de naixement, tipus, categoria i inici; sense document ni contacte."
      B: "El mateix amb el document d'identitat (tipus i número), si la FECDAS el demana."
      C: "El model exacte de la FECDAS (Excel o el seu formulari), quan la secretaria el porti."
    recomanada: C
    perque: >-
      Només la FECDAS sap què vol rebre; A és el mínim prudent mentrestant i no envia cap dada que potser no calgui
      (RN-M06-11). Canviar el format és tocar una funció, sense dades desades.
    data: 2026-11-21
  P-425:
    opcions:
      A: "3 mesos després de verificar la titulació o tancar l'homologació (ajust VC-57); la titulació en queda verificada sense foto."
      B: "S'esborra el mateix dia que es verifica la titulació o es tanca l'homologació (VC-57 = 0)."
      C: "Mentre la persona sigui sòcia, i s'esborra en donar-se de baixa."
      D: "El termini que la gestoria digui per a documents d'identitat, amb la base legal per enviar-la a la FECDAS."
    recomanada: A
    perque: >-
      Dona marge per si la FECDAS demana la foto un altre cop i no guarda una dada amb la cara més del que cal; és un
      ajust, i si la gestoria diu un altre termini només canvia el valor.
      Resposta provisional del propietari (21/11/2026): A, amb la petició del soci com a base i un
      avís en pujar la foto; continua oberta per a la gestoria.
    data: 2026-11-21
  P-426:
    opcions:
      A: "La paga l'alumne amb el flux normal del 06: la secretaria la demana i l'alumne rep el càrrec."
      B: "El preu del curs ja la inclou: la llicència es crea sense càrrec, i el preu del curs ho ha de dir."
      C: "La paga el club i va com a despesa del departament de cursos."
    recomanada: A
    perque: >-
      És el flux que ja existeix i no inventa cap càrrec ni cap despesa; si el curs ja la inclou, cal saber-ho abans
      de cobrar el primer alumne real.
      Resposta provisional del propietari (21/11/2026): B, configurable a cada fitxa del catàleg
      («Inclou la primera llicència», sí per defecte als cursos de primera estrella); falta el tresorer.
    data: 2026-11-21
  P-427:
    opcions:
      A: "Gratuïtes de moment: preu 0 i VC-59 apagat."
      B: "Un preu per a l'homologació, ingrés al departament «General»."
      C: "Un preu per a cada tramitació, ingrés al departament de cursos."
    recomanada: A
    perque: >-
      El propietari no ha dit cap preu i la FECDAS cobra la titulació a part; si el club en vol cobrar, és un ajust
      amb data d'entrada en vigor i no cal tocar codi.
      Resposta provisional del propietari (21/11/2026): A, i el departament dels cursos per defecte;
      falta el tresorer.
    data: 2026-11-21
  P-446:
    opcions:
      A: "No compleix el requisit, amb el text «Pendent de confirmar»: en mode d'avís s'inscriu marcada; en mode de bloqueig, no."
      B: "Compleix el requisit, però el responsable la veu marcada «pendent de confirmar»."
      C: "Com A en mode de bloqueig i com B en mode d'avís."
    recomanada: A
    perque: >-
      No se sap si la llicència cobreix el dia de l'activitat, i el club no pot deixar bussejar ningú sense assegurança;
      la secretaria ha de confirmar les pendents abans d'obrir el 02 (RN-M02-34), de manera que a la pràctica gairebé no
      passarà. B i C són una línia si la secretaria ho prefereix.
    data: 2026-11-21
  P-448:
    opcions:
      A: "Tots els tipus de soci actius, amb la seva quota, de més barat a més car."
      B: "Només els tipus de ple dret."
      C: "Només la quota del tipus que li tocaria segons l'edat (cal demanar-la a la pàgina)."
    recomanada: A
    perque: >-
      És la informació sencera i no promet a ningú un preu que potser no li toca (RN-M06-07); C seria més exacta però
      demanaria la data de naixement en una pàgina pública només per mostrar un preu.
    data: 2026-11-21
  P-504:
    opcions:
      A: "Només el tresorer edita el llindar de marge baix i els dies dels avisos dels ajuts; l'administrador consulta."
      B: "El tresorer i l'administrador els editen, com diuen MG14 i AJ10 a la matriu."
      C: "Només l'administrador els edita, a petició del tresorer."
    recomanada: A
    perque: >-
      És el que diu «Qui el canvia» de cada valor i el que fan els altres apartats d'ajustos; és la més
      conservadora i, si la junta tria B, és canviar una cel·la des de l'app, sense codi.
  P-530:
    opcions:
      A: "Un ajust del 06 amb el tipus de la primera llicència, buit fins que la secretaria i el tresorer el triïn; mentre és buit no es crea cap llicència inclosa i la llista ho diu."
      B: "Un camp a la fitxa del curs del catàleg (cada curs diu quin tipus inclou)."
      C: "Sempre el mateix tipus, escrit a la regla."
      D: "La secretaria el tria cada vegada, també per a la inclosa."
    recomanada: A
    perque: >-
      És una dada que pot canviar sense tocar codi (055) i deixa que el 02 creï la inclosa sola en quedar apte; com
      que toca diners, comença buida (D2, conservador) i mai no hi ha un camí amb càrrec per a un curs que la
      inclou. B només cal si cursos diferents inclouen tipus diferents, i C posaria un valor de negoci al codi.
    data: 2026-11-23
  P-531:
    opcions:
      A: "Cap acció automàtica: el càrrec pagat queda pagat i el tresorer decideix la devolució amb el 05b."
      B: "Proposta de devolució automàtica al tresorer, com una inscripció cancel·lada."
      C: "No es torna mai si l'assignació ja era confirmada (el centre ja ho ha cobrat al club)."
      D: "Es torna només si es cancel·la abans de la llista de lloguer enviada."
    recomanada: B
    perque: >-
      És el mateix camí que la inscripció (el tresorer aprova cada devolució) i el participant no paga un lloguer que
      no ha fet servir; mentre no hi hagi resposta, A és el més conservador i l'interruptor continua apagat.
    data: 2026-11-23
  P-503:
    opcions:
      A: "El responsable i qui té AJ10 (configurar els dies dels avisos): d'inici el Tresorer i l'Administrador."
      B: "El responsable i qui té AJ8 (marcar justificada o tancada): el mateix grup d'inici."
      C: "El responsable i qui té el rol Tresorer, escrit al codi."
      D: "Només el responsable."
    recomanada: A
    perque: >-
      Els destinataris surten de la matriu (079) i qui decideix quan surten els avisos és qui els ha de rebre; C
      trencaria la regla de no escriure rols al codi i D deixaria el tresorer sense saber que s'acosta un termini.
  P-505:
    opcions:
      A: "El web públic del Meteocat (https://www.meteo.cat/) i l'administrador hi posa la pàgina exacta des dels ajustos."
      B: "Cap enllaç per defecte fins que l'administrador n'escrigui un."
      C: "Un altre servei públic de previsió marítima que triï la junta."
    recomanada: A
    perque: >-
      Compleix «inicial, Meteocat» sense inventar una adreça que podria no existir, i és un valor dels
      ajustos: canviar-lo no demana tocar codi ni desplegar.
    data: 2026-11-23
  P-545:
    opcions:
      A: "Cap canvi ara: la junta no hi arriba fins que la junta decideixi (els resultats es veuen des de les activitats)."
      B: "Una llista pròpia «Resultats ambientals» al menú per a qui té AC14 (també la junta)."
      C: "Un enllaç als resultats ambientals des d'«Informes d'activitats», si la junta també té AC20."
    recomanada: B
    perque: >-
      Si la junta ha de consultar els resultats (AC14), necessita un camí que no passi per la gestió de
      les activitats; és una pantalla de només lectura i no dona accés a dades personals.
    data: 2026-11-24
    data: 2026-11-21
  P-570:
    opcions:
      A: "Cada indicador té una llista de panells i surt a tots, amb la mateixa xifra."
      B: "Un sol panell per indicador: el panell general en fa una còpia amb un codi propi."
      C: "Un sol panell per indicador: els impagats i les llicències només surten al de socis."
    recomanada: A
    perque: >-
      La xifra és la mateixa i ve del mateix servei (RN-M08-04): una sola entrada al catàleg, amb una
      sola definició i un sol text d'ajuda, evita que dues còpies es contradiguin.
    data: 2026-11-24
  P-571:
    opcions:
      A: "Un tercer tipus «altres» (places, material, dates) que no passa per la supressió de grups petits."
      B: "Tot el que no és diners compta com a «persones» i passa per la supressió."
      C: "Cap tipus: cada panell decideix què amaga."
    recomanada: A
    perque: >-
      Amagar «2 equips per revisar» com a «menys de 3» no protegeix ningú i fa inútil l'avís; el que compta
      persones (inscripcions, ocupació, assistència) continua amb la supressió, que és el cas conservador.
    data: 2026-11-24
