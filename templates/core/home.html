{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <h1>{% translate "Plataforma del C.R.I.S." %}</h1>
  <p>{% blocktranslate with name=user.person.first_name %}Hola, {{ name }}.{% endblocktranslate %}</p>
  <p><a href="{% url 'accounts:security' %}">{% translate "Seguretat del compte" %}</a></p>
  <form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit">{% translate "Sortir" %}</button>
  </form>
{% endblock %}
