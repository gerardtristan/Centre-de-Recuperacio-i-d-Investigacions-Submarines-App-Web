{% load i18n %}{% if member.status == "active" %}<span class="estat estat-ok"><span aria-hidden="true">✓</span> {{ member.get_status_display }}</span>{% elif member.status == "pending" %}<span class="estat estat-avis"><span aria-hidden="true">◷</span> {{ member.get_status_display }}</span>{% elif member.status == "unpaid" %}<span class="estat estat-error"><span aria-hidden="true">✕</span> {{ member.get_status_display }}</span>{% else %}<span class="estat estat-neutre"><span aria-hidden="true">■</span> {{ member.get_status_display }}</span>{% endif %}
