# Tauler de preguntes pendents: opcions i recomanació de Claude
#
# El tauler és un apartat de la línia cronològica, protegit amb una segona contrasenya
# (tools/linia-cronologica/README.md). Mostra totes les preguntes obertes que el generador ja llegeix:
# docs/decisions/pendents.md (oberts i preguntes de les tandes), l'apèndix de preguntes de
# docs/planning.md (#preguntes) i docs/preguntes-externes.md.
#
# Aquest fitxer NO repeteix el text de les preguntes: només hi afegeix les opcions A a D i quina
# recomana Claude, escrita en el moment de fer la pregunta (mai per la IA de Make). Una pregunta
# sense entrada aquí surt al tauler només amb la resposta lliure.
#
# Clau: l'identificador tal com surt a la font (P-49, «S-M01-04», «S-M01-12, 13»...). Les preguntes
# de les tandes de pendents.md llegeixen les opcions de la columna «Opcions» i no cal posar-les aquí.
#
# Camps de cada entrada:
#   punt        (opcional) quina part concreta de la pregunta responen les opcions
#   opcions     de 2 a 4, amb les claus A, B, C i D
#   recomanada  la clau que recomana Claude
#   perque      per què, en una o dues frases
#   data        quan es va escriure la recomanació (AAAA-MM-DD)
#
# Preguntes noves que Claude fa en un fil i que no són a cap altra font: van a «noves», amb
# un identificador F-NNN que no es reutilitza, i també porten:
#   pregunta, context, responsable, tasques (llista), bloqueja (true si atura una tasca)
# Quan la resposta s'incorpora al pla o a una decisió, l'entrada de «noves» s'esborra.

opcions:
  P-07:
    opcions:
      A: No es desa res del certificat mèdic; el centre de busseig o l'instructor el comprova fora de la plataforma.
      B: Només la data fins a la qual és vàlid, sense cap document ni cap altra dada.
      C: El soci declara en inscriure's que té el certificat vigent (sí o no), sense desar cap data.
      D: Decidir-ho amb l'assessor de protecció de dades abans de triar.
    recomanada: A
    perque: >-
      La regla «cap dada de salut a la plataforma» és del CLAUDE.md, i fins i tot una data de validesa
      revela que la persona té (o no) un certificat mèdic. A és l'única opció que no obre cap
      excepció; si més endavant cal, es pot passar a C sense migrar dades.
    data: 2026-11-12

  P-11:
    opcions:
      A: El CLAUDE.md fa de constitució i no es crea cap fitxer nou.
      B: Crear docs/constitution.md amb els principis i deixar al CLAUDE.md només les instruccions per a Claude.
    recomanada: A
    perque: >-
      El CLAUDE.md ja té les regles que s'han de complir sempre; un segon fitxer duplicaria el contingut,
      cosa que el mateix CLAUDE.md prohibeix.
    data: 2026-11-12

  P-13:
    opcions:
      A: Anonimitzar les entrevistes (rols en lloc de noms, sense dades de contacte) i pujar-les a docs/context/.
      B: No pujar-les mai; només un resum anonimitzat de les conclusions.
      C: Deixar-les fora del repositori tal com estan ara.
    recomanada: B
    perque: >-
      Un resum de conclusions dona el mateix valor per al projecte i elimina el risc que una frase concreta
      permeti identificar algú. Anonimitzar un text sencer és més feina i més fàcil de fer malament.
    data: 2026-11-12

  P-14:
    opcions:
      A: Fer una versió nova del document incremental amb el context v4 i moure l'actual a docs/arxiu/.
      B: Mantenir l'actual com a vigent i afegir-hi un annex amb els canvis del context v4.
      C: No tocar-lo fins a la propera entrega de l'assignatura.
    recomanada: C
    perque: >-
      És un lliurament de l'assignatura: el moment natural de fer-ne la versió nova és la propera entrega,
      i llavors es fa com diu A (versió nova i l'antiga a l'arxiu, que mai s'esborra).
    data: 2026-11-12

  P-22:
    opcions:
      A: Claude genera un .docx nou amb els textos de substitució aplicats i el PDF corresponent.
      B: Aplicar els textos a mà al .docx actual.
      C: Deixar el .docx com a document històric i remetre al pla (docs/planning.md) per a la versió vigent.
    recomanada: C
    perque: >-
      El pla és la font única de l'especificació (decisió 047); mantenir el .docx al dia duplica feina cada
      vegada que canvia una regla. Una nota a la portada que remeti al pla evita confusions.
    data: 2026-11-12

  P-38:
    opcions:
      A: Fase futura, després del mòdul 02 (que registra l'assistència); llavors es decideixen fites i punts.
      B: Només la bitàcola (sortides i hores), sense insígnies ni punts.
      C: Bitàcola i insígnies, sense punts.
      D: Treure-ho del wireframe del compte personal fins que la junta ho demani.
    recomanada: A
    perque: >-
      Les dades de la bitàcola surten de l'assistència del mòdul 02, que encara no existeix. Decidir ara
      fites i punts seria decidir sobre dades que no tenim.
    data: 2026-11-12

  P-39:
    opcions:
      A: Corregir el nom a la propera versió del document incremental (lligat a la P-14).
      B: Fer ara una versió corregida només amb el nom.
    recomanada: A
    perque: Els fitxers de text del repositori ja estan corregits; el PDF es pot esperar a la propera versió.
    data: 2026-11-12

  P-41:
    opcions:
      A: Cap foto sense autor i permís registrats, consentiment de les persones que hi surtin i text de crèdit fix.
      B: Al principi, només fotos sense persones reconeixibles (fons marí, material, instal·lacions).
      C: Fotos amb persones només de socis que ho hagin acceptat al seu perfil.
      D: Cap foto fins que la web pública (mòdul 07) estigui a punt de sortir.
    recomanada: B
    perque: >-
      B permet tenir galeria des del primer dia sense haver de gestionar consentiments; A és la regla per a
      quan s'hi vulguin afegir fotos amb persones.
    data: 2026-11-12

  P-48:
    opcions:
      A: No; un sol tresorer i cap acció amb doble aprovació.
      B: Només com a opció futura, si la junta la demana per a devolucions a partir d'un import.
    recomanada: A
    perque: >-
      El club té un sol tresorer i la regla del projecte és no fer de la doble aprovació un requisit.
      Si la junta ho vol més endavant, es reobre amb una decisió nova.
    data: 2026-11-12

  P-49:
    punt: "(1) quines llengües vol el club i on"
    opcions:
      A: Només català a tota la plataforma, de moment (la plataforma ja queda preparada per traduir-se, 061).
      B: Català i castellà només a la web pública.
      C: Català i castellà a la web pública i als correus; l'àrea de socis i l'administració, només en català.
      D: Català, castellà i anglès a la web pública; la resta, només en català.
    recomanada: A
    perque: >-
      Cada llengua activa demana una persona que tradueixi i revisi cada canvi, també dels textos legals.
      Sense aquesta persona, la 061 ja diu que la llengua no s'activa; és millor decidir-ho quan hi sigui.
    data: 2026-11-12

  P-53:
    punt: "si la cua de la T-M01-39 és condició del nivell 1 de producció (Q-086)"
    opcions:
      A: No és condició del nivell 1; es fa quan toqui, com qualsevol altra tasca.
      B: Només és condició si la mesura darrere del proxy encara mostra una diferència apreciable (més de 5 ms de mediana).
      C: Sí, és condició del nivell 1 sigui quin sigui el resultat de la mesura.
    recomanada: B
    perque: >-
      La diferència es va mesurar en local; darrere del proxy i de la xarxa pot quedar amagada pel soroll.
      Decidir amb la mesura real evita fer una cua que potser no cal.
    data: 2026-11-12

  P-61:
    punt: "(2) si el «suspens» d'un termini impagat és la marca manual d'impagat (040) o un bloqueig automàtic"
    opcions:
      A: La marca manual d'impagat (040); la plataforma proposa el candidat i el tresorer el confirma amb motiu, com amb la quota (085, J-4).
      B: Bloqueig automàtic l'endemà del venciment del termini.
      C: Bloqueig automàtic amb un avís previ al soci uns dies abans.
      D: Ajornar-ho fins que comenci la T-M01-49.
    recomanada: A
    perque: >-
      Fa servir el mateix mecanisme que ja està aprovat per a la quota anual (040 i 085), així el soci i el
      tresorer veuen una sola regla i no cal cap estat nou.
    data: 2026-11-12

noves:
  F-003:
    pregunta: Com fem que cada apartat d'ajustos tingui per rol els permisos «veure» i «veure i editar»?
    context: >-
      Ho demanes per a tots els ajustos (13/11/2026), i la 085 (J-1 i J-7) ja diu que qui veu i qui edita
      cada bloc ho ha de poder canviar l'administrador. El pla només té el permís d'editar cada valor
      (settings.edit.<clau>, decisions 059 i 060) i la pantalla la veu qui en pot editar algun (RN-AJ-05).
      Encara no hi ha cap pantalla d'ajustos feta, així que no cal desfer res. Revisió:
      docs/estat/revisio-valors-configurables.md. Pendents: P-75.
    responsable: Responsable del projecte (tu)
    tasques: [T-AJ-02, T-RP-03]
    bloqueja: false
    opcions:
      A: Un permís nou «veure» per apartat (settings.view.<mòdul>) a més del d'editar cada valor; al principi, el «veure» el tenen els mateixos rols que editen.
      B: Un permís per apartat amb dos nivells, «Cons.» (veure) i «Sí» (veure i editar tots els valors de l'apartat), com la resta de la matriu; el permís per valor es manté per donar-ne només una part.
      C: Dos permisos per apartat («veure» i «veure i editar») en lloc d'un per valor.
      D: Deixar-ho com diu el pla (només qui edita, veu).
    recomanada: B
    perque: >-
      La matriu ja fa servir «Cons.» i «Sí» i el codi ja sap rebutjar una edició amb «Cons.», així que
      no cal cap mecanisme nou. Es manté un permís d'editar per valor dins l'apartat, de manera que es
      pot donar a un rol només una part dels valors (per exemple, els preus al tresorer).
    data: 2026-11-13
  F-007:
    pregunta: Fem editables des de l'app el termini del suplement (7 dies), els recordatoris de quota (−15, −1, 0, +15, +30 dies) i els tipus de soci?
    context: >-
      La revisió del codi els troba escrits al codi o en una variable d'entorn. El primer no té cap tasca;
      el segon té la T-M01-32, però la clau del pla no pot desar els cinc dies. El 01 és congelat (D1):
      afegir-los demana una decisió numerada i una PR risc:alt. També els tipus de soci: són dades, però
      les regles depenen de dos codis fixos i no se'n pot afegir cap des de l'app. Pendents: P-79.
    responsable: Responsable del projecte (tu), amb el tresorer
    tasques: [T-M01-32]
    bloqueja: false
    opcions:
      A: Sí, tots tres, ampliant la T-M01-32 amb una decisió nova i una tasca nova per als tipus.
      B: Només els dos valors (suplement i recordatoris); els tipus es queden com són.
      C: Ara no; es revisa quan acabi la prova d'acceleració (27/11/2026).
    recomanada: A
    perque: >-
      Ho demanes tu (13/11/2026; regla a la PR #24) i la feina dels valors és petita, perquè la T-M01-32 ja ha de fer la pantalla
      d'ajustos del 01. Fer-ho ara evita una segona tanda sobre el mateix mòdul.
    data: 2026-11-13
  F-004:
    pregunta: Quan canvia el preu estàndard d'un lloc (per exemple, de 45 a 50 €), què passa amb les sortides que ja s'hi havien creat?
    context: >-
      Addenda de llocs del mòdul 02 (PR de la proposta, 13/11/2026). En crear una sortida es copia el preu
      estàndard vigent del lloc; aquesta pregunta és què passa després. Per als cursos, el pla ja diu que un
      canvi de preu del catàleg no toca les activitats creades (RN-M02-05). Les inscripcions ja fetes
      conserven sempre el seu preu (RN-M02-04). Pendents: P-76.
    responsable: Responsable del projecte (tu), amb el tresorer
    tasques: [T-M02-37, T-M02-40]
    bloqueja: false
    opcions:
      A: Es conserva el preu que tenia, en qualsevol estat. Si cal, el responsable el canvia a mà amb nota.
      B: S'actualitza a les sortides en esborrany; les publicades conserven el seu.
      C: S'actualitza a totes les que encara no tenen cap inscripció.
      D: En desar el preu nou, la pantalla mostra les sortides afectades i qui el canvia tria a quines s'aplica (només sense inscripcions).
    recomanada: A
    perque: >-
      És el mateix criteri que el catàleg de cursos i cap preu publicat canvia sense que algú ho decideixi.
      Una sortida en esborrany es pot corregir a mà en un moment; B és l'alternativa raonable si es
      creen moltes sortides amb antelació.
    data: 2026-11-13
  F-005:
    pregunta: El preu estàndard d'un lloc ha de tenir un sol import o dos (soci i no soci)?
    context: >-
      Addenda de llocs del mòdul 02. Les activitats i el catàleg de cursos ja tenen preu de soci i de no
      soci. Pendents: P-77.
    responsable: Responsable del projecte (tu)
    tasques: [T-M02-37]
    bloqueja: false
    opcions:
      A: Dos imports, soci i no soci, com el catàleg.
      B: Un import (el de soci); el de no soci s'escriu a mà a cada sortida.
      C: Un import i el de no soci surt d'un recàrrec fix, que és un ajust del mòdul.
    recomanada: A
    perque: >-
      Fa servir el mateix model que el catàleg i l'activitat, i evita haver d'escriure el preu de no soci
      a cada sortida. Si el club vol un recàrrec fix, C es pot afegir després sense perdre dades.
    data: 2026-11-13
  F-006:
    pregunta: Quan prepares una sortida o un curs, el «cost de material» que es pot canviar respecte de l'estàndard és el cost per al club o el preu que paga el participant?
    context: >-
      Addenda de llocs dels mòduls 02 i 03. La fórmula del marge (CLAUDE.md) parla de «cost de material»
      com a cost per al club. El participant paga el material llogat al preu de la tarifa del centre
      (RN-M03-06 i 11). L'estàndard proposat: material típic per la tarifa de cost del centre habitual del
      lloc o, si no n'hi ha, pel cost d'ús del club (RN-M03-25), que ha de validar el tresorer. Pendents: P-78.
    responsable: Responsable del projecte (tu), amb el tresorer
    tasques: [T-M02-40, T-M03-27]
    bloqueja: false
    opcions:
      A: Cost previst per al club, per participant. És una previsió per al marge; no canvia el que paga ningú.
      B: Preu del material llogat per al participant en aquella activitat, en lloc del de la tarifa del centre.
      C: Totes dues coses, cadascuna amb la seva nota.
      D: Res a la fitxa de l'activitat; el cost previst es posa només al mòdul 09 (costos previstos).
    recomanada: A
    perque: >-
      A ajuda a fixar el preu de la sortida i no toca cap import cobrat. B canvia el que paga un soci i
      afecta el marge dels lloguers; si es vol, cal decidir-ho a part.
    data: 2026-11-13
